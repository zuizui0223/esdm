name: e2-mica-response-blind-contract

on:
  pull_request:
    paths:
      - 'docs/replication/E2_EMPIRICAL_REPLICATION_CONTRACT.json'
      - 'docs/replication/E2_MICA_MUSKRAT_CANDIDATE_CONTRACT.json'
      - 'src/esdm/validate/e2_mica_response_blind.py'
      - 'scripts/qualify_e2_mica_response_blind.py'
      - 'tests/test_e2_mica_response_blind.py'
      - '.github/workflows/e2-mica-response-blind-contract.yml'
      - '.github/workflows/e2-mica-response-blind-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and tests
        run: python -m pip install -e '.[dev]'
      - name: Validate response-blind MICA contracts and qualifier
        run: python -m pytest -q tests/test_e2_mica_response_blind.py
      - name: Compile qualifier runner
        run: python -m py_compile scripts/qualify_e2_mica_response_blind.py
      - name: Confirm one-shot workflow has no manual dispatch
        run: |
          ! grep -q "workflow_dispatch" .github/workflows/e2-mica-response-blind-once.yml
