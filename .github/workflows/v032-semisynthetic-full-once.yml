name: v0.3.2 frozen Gate F-prime separation full run

on:
  push:
    branches:
      - feature/v032-identifiability-hardening
    paths:
      - .github/workflows/v032-semisynthetic-full-once.yml
      - scripts/run_v032_semisynthetic.py
      - src/esdm/model/backend_numpyro.py
      - src/esdm/observe/effort.py
      - src/esdm/observe/presence_only.py

jobs:
  gate-f-prime:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation and inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,inference]"
      - name: Initialize fail-closed audit artifact
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os
          payload = {
              "schema": "esdm.v032.gate_f_prime.v1",
              "git_sha": os.environ.get("GITHUB_SHA"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "status": "INFRASTRUCTURE_BLOCKED",
              "infrastructure_block": {
                  "stage": "workflow_precheck",
                  "reason": "benchmark did not yet overwrite the fail-closed placeholder",
              },
          }
          with open("artifacts/v032_semisynthetic_gate_f_prime.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - name: Verify frozen v0.3.2 contracts
        run: |
          python -m pytest -q \
            tests/test_v032_explicit_targets.py \
            tests/test_v032_array_backend.py \
            tests/test_v032_jax_scaling.py \
            tests/test_v032_identifiability.py \
            tests/test_v032_evidence_api.py \
            tests/test_v032_semisynthetic_fixture.py \
            tests/test_v032_semisynthetic_gate.py \
            tests/test_v032_identification_profiles.py \
            tests/test_v032_semisynthetic_script.py \
            tests/test_v032_partial_effort_numpyro.py
      - name: Run frozen Gate F-prime separation benchmark
        run: |
          python scripts/run_v032_semisynthetic.py \
            --output artifacts/v032_semisynthetic_gate_f_prime.json
      - name: Upload Gate F-prime audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v032-gate-f-prime-${{ github.run_id }}
          path: artifacts/v032_semisynthetic_gate_f_prime.json
          if-no-files-found: error
