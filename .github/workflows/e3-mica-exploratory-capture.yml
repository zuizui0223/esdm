name: E3 MICA exploratory capture

on:
  pull_request:
    paths:
      - 'src/esdm/validate/e3_mica_exploratory_fit.py'
      - 'scripts/capture_e3_mica_exploratory.py'
      - '.github/workflows/e3-mica-exploratory-capture.yml'
      - 'docs/replication/E3_MICA_EXPLORATORY_CONTRACT.json'
      - 'docs/replication/E3_MICA_EXPLORATORY_PREFLIGHT_RESULT.json'

permissions:
  actions: read
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Download immutable E2 capture artifact
        uses: actions/download-artifact@v4
        with:
          name: e2-mica-full-response-capture-36369531079
          path: captured
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36369531079

      - name: Build E3 exploratory fixture
        run: |
          mkdir -p build/e3
          python scripts/capture_e3_mica_exploratory.py \
            --archive captured/build/e2/source/mica-v3.zip \
            --climate captured/frozen-climate/E2_MICA_WORLDCLIM_RESULT.json \
            --out build/e3/E3_MICA_EXPLORATORY_CAPTURE_RESULT.json

      - name: Upload E3 capture receipt
        uses: actions/upload-artifact@v4
        with:
          name: e3-mica-exploratory-capture-${{ github.run_id }}
          path: build/e3/E3_MICA_EXPLORATORY_CAPTURE_RESULT.json
          if-no-files-found: error
          retention-days: 90
