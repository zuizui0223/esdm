name: NeoBat botanical global datasetKey embargo source-free regression

on:
  push:
    branches:
      - analysis/neobat-crosscountry-dataset-embargo-20261119
    paths:
      - scripts/neobat_plant_global_dataset_embargo_gate.py
      - tests/test_neobat_plant_global_dataset_embargo_gate.py
      - .github/workflows/neobat-plant-global-dataset-embargo-sourcefree.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test source embargo including low-precision original source rows
        run: |
          python -m py_compile scripts/neobat_plant_global_dataset_embargo_gate.py
          python -m unittest discover -s tests -p 'test_neobat_plant_global_dataset_embargo_gate.py' -v
