name: NeoBat original DOI 3-plant Colombia country-crossfit pilot once

on:
  push:
    branches:
      - analysis/neobat-plant-country-crossfit-pilot-20261119
    paths:
      - docs/replication/neobat/NEOBAT_PLANT_CROSSFIT_CO_ONCE_20261119.txt

permissions:
  contents: write

concurrency:
  group: neobat-3plant-CO-crossfit-original-20261119
  cancel-in-progress: false

jobs:
  original_3plant_country_crossfit:
    if: github.event.head_commit.message == 'dispatch frozen NeoBat 3-plant Colombia crossfit original once' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/neobat-plant-country-crossfit-pilot-20261119
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical/raster/model dependencies
        run: |
          python -m pip install 'numpy==2.2.6' 'scikit-learn==1.7.2' 'rasterio==1.4.3' 'pyproj==3.7.2'
      - name: Verify original-study design precedes model outcomes and known-truth tests
        run: |
          test -f docs/replication/NEOBAT_COUNTRY_EXCLUDED_PLANT_SDM_PILOT_FROZEN_20261119.md
          test -f docs/replication/neobat/v2_106plant_reference_input_gate.json
          python -m py_compile scripts/neobat_plant_country_crossfit_pilot.py
          python -m unittest discover -s tests -p 'test_neobat_plant_country_crossfit_pilot.py' -v
      - name: Fit frozen 3 source-verified original DOI plant models with Colombia excluded
        run: |
          mkdir -p build/neobat
          set +e
          python -m scripts.neobat_plant_country_crossfit_pilot \
            --out build/neobat/plant_colombia_crossfit_pilot.json
          status=$?
          set -e
          echo "$status" > build/neobat/plant_colombia_crossfit_pilot_exit_code.txt
          echo "NEOBAT_PLANT_CO_PILOT_EXIT=$status"
      - name: Preserve aggregate-only status and plant rank outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neobat-3plant-colombia-crossfit-original-aggregate
          path: |
            build/neobat/plant_colombia_crossfit_pilot.json
            build/neobat/plant_colombia_crossfit_pilot_exit_code.txt
          retention-days: 90
          if-no-files-found: warn
      - name: Commit original DOI model outcomes with no raw samples
        if: always()
        run: |
          set -euo pipefail
          test -f build/neobat/plant_colombia_crossfit_pilot.json
          cp build/neobat/plant_colombia_crossfit_pilot.json docs/replication/neobat/
          cp build/neobat/plant_colombia_crossfit_pilot_exit_code.txt docs/replication/neobat/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/replication/neobat/plant_colombia_crossfit_pilot*
          if ! git diff --cached --quiet; then
            git commit -m "evidence: pilot first 3 original plant country-excluded SDM ranks, no bat outcomes"
            git pull --rebase origin analysis/neobat-plant-country-crossfit-pilot-20261119
            git push origin HEAD:analysis/neobat-plant-country-crossfit-pilot-20261119
          fi
      - name: Fail closed on original hashes, raster, or model implementation
        run: |
          test "$(cat build/neobat/plant_colombia_crossfit_pilot_exit_code.txt)" = "0"
