name: NeoBat 3-plant Colombia crossfit synthetic source-free regression
on:
  push:
    branches:
      - analysis/neobat-plant-country-crossfit-pilot-20261119
    paths:
      - scripts/neobat_plant_country_crossfit_pilot.py
      - tests/test_neobat_plant_country_crossfit_pilot.py
      - .github/workflows/neobat-plant-crossfit-pilot-sourcefree.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  known_truth_plant_country_split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical-only synthetic regression dependencies
        run: python -m pip install 'numpy==2.2.6' 'scikit-learn==1.7.2'
      - name: Validate outcountry pseudo-background and known-truth classifiers
        run: |
          python -m py_compile scripts/neobat_plant_country_crossfit_pilot.py
          python -m unittest discover -s tests -p 'test_neobat_plant_country_crossfit_pilot.py' -v
