name: E5 Queensland deployment-only capture once

concurrency:
  group: e5-qld-wet-tropics-deployment-capture-once
  cancel-in-progress: false

on:
  push:
    branches:
      - e5/qld-wet-tropics-deployment-capture-v1
    paths:
      - 'docs/replication/E5_QLD_DEPLOYMENT_CAPTURE_AUTHORIZED.json'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WILDOBSR_API_KEY: ${{ secrets.WILDOBSR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify pure one-shot deployment authorization
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          marker_path = Path(
              "docs/replication/E5_QLD_DEPLOYMENT_CAPTURE_AUTHORIZED.json"
          )
          marker = json.loads(marker_path.read_text(encoding="utf-8"))
          parent = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"], text=True
          ).strip()
          changed = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
              text=True,
          ).splitlines()
          contract_path = Path(
              "docs/replication/E5_QLD_WET_TROPICS_DEPLOYMENT_METADATA_CONTRACT.json"
          )
          contract_blob = subprocess.check_output(
              ["git", "hash-object", str(contract_path)], text=True
          ).strip()

          if changed != [marker_path.as_posix()]:
              raise SystemExit("authorization commit must change only marker")
          if marker.get("implementation_parent_sha") != parent:
              raise SystemExit("implementation parent mismatch")
          if marker.get("programme_id") != "E5_INDEPENDENT_ACTIVITY_DETECTION":
              raise SystemExit("programme mismatch")
          if marker.get("candidate_id") != "qld_wet_tropics_camtrapdp_2022_2023":
              raise SystemExit("candidate mismatch")
          if marker.get("contract_id") != (
              "e5-qld-wet-tropics-deployment-metadata-acquisition-v1"
          ):
              raise SystemExit("contract id mismatch")
          if marker.get("contract_blob_sha") != "21d43a2e67aa65147602e0cbffb121fa729e23ba":
              raise SystemExit("contract blob pin mismatch")
          if contract_blob != marker["contract_blob_sha"]:
              raise SystemExit("working-tree contract blob mismatch")
          if marker.get("capture_authorized") is not True:
              raise SystemExit("capture not authorized")
          if marker.get("one_shot") is not True:
              raise SystemExit("authorization must be one-shot")
          if marker.get("observations_authorized") is not False:
              raise SystemExit("observations remain forbidden")
          if marker.get("media_authorized") is not False:
              raise SystemExit("media remain forbidden")
          if marker.get("model_fitting_authorized") is not False:
              raise SystemExit("model fitting remains forbidden")
          PY

      - name: Compile deployment precheck
        run: python -m py_compile scripts/precheck_e5_qld_wet_tropics_deployments.py

      - name: Run deployment-only capture or freeze transport stop
        run: |
          mkdir -p build/public
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          out = Path("build/public/E5_QLD_DEPLOYMENT_CAPTURE_RESULT.json")
          key = os.environ.get("WILDOBSR_API_KEY", "")
          if not key:
              value = {
                  "schema_version": 1,
                  "programme_id": "E5_INDEPENDENT_ACTIVITY_DETECTION",
                  "candidate_id": "qld_wet_tropics_camtrapdp_2022_2023",
                  "status": "E5_DEPLOYMENT_CAPTURE_TRANSPORT_STOP",
                  "reason": "WILDOBSR_API_KEY secret is not configured",
                  "response_boundary": {
                      "collections_queried": [],
                      "observation_collection_queried": False,
                      "media_collection_queried": False,
                      "observation_rows_read": 0,
                      "media_rows_read": 0,
                      "species_fields_read": 0,
                      "focal_response_opened": False
                  },
                  "decision": {
                      "candidate_qualified": False,
                      "focal_response_opening_authorized": False,
                      "model_fitting_authorized": False,
                      "same_authorization_retry_allowed": False
                  }
              }
              out.write_text(
                  json.dumps(value, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          else:
              subprocess.run([
                  "python",
                  "scripts/precheck_e5_qld_wet_tropics_deployments.py",
                  "--out",
                  str(out),
              ], check=True)
          PY

      - name: Verify response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(
              Path("build/public/E5_QLD_DEPLOYMENT_CAPTURE_RESULT.json")
              .read_text(encoding="utf-8")
          )
          b = value["response_boundary"]
          assert b["observation_collection_queried"] is False
          assert b["media_collection_queried"] is False
          assert b["observation_rows_read"] == 0
          assert b["media_rows_read"] == 0
          assert b["species_fields_read"] == 0
          assert b["focal_response_opened"] is False
          assert value["decision"]["candidate_qualified"] is False
          assert value["decision"]["focal_response_opening_authorized"] is False
          assert value["decision"]["model_fitting_authorized"] is False
          PY

      - name: Upload response-blind deployment result
        uses: actions/upload-artifact@v4
        with:
          name: e5-qld-deployment-capture-${{ github.run_id }}
          path: build/public/E5_QLD_DEPLOYMENT_CAPTURE_RESULT.json
          if-no-files-found: error
          retention-days: 90
