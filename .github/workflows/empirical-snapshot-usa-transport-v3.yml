name: empirical-snapshot-usa-transport-v3

on:
  pull_request:
    paths:
      - 'docs/empirical/SNAPSHOT_USA_2024_TRANSPORT_V3_CONTRACT.json'
      - 'src/esdm/validate/empirical_snapshot_usa_transport_v3.py'
      - 'scripts/run_snapshot_usa_2024_transport_v3.py'
      - 'tests/test_empirical_snapshot_usa_transport_v3.py'
      - '.github/workflows/empirical-snapshot-usa-transport-v3.yml'
      - '.github/workflows/empirical-snapshot-usa-transport-v3-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and tests
        run: python -m pip install -e '.[dev]'
      - name: Validate response-blind Dryad API transport v3
        run: >-
          python -m pytest -q
          tests/test_empirical_snapshot_usa_metadata.py
          tests/test_empirical_snapshot_usa_transport_v2_result.py
          tests/test_empirical_snapshot_usa_transport_v3.py
      - name: Compile runner
        run: python -m py_compile scripts/run_snapshot_usa_2024_transport_v3.py
