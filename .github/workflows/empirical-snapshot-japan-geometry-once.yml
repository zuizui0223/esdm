name: empirical R5b Snapshot Japan geometry

concurrency:
  group: empirical-r5b-snapshot-japan-geometry
  cancel-in-progress: false

on:
  push:
    branches:
      - release/empirical-r5b-freeze
    paths:
      - docs/empirical/SNAPSHOT_JAPAN_GEOMETRY_CONTRACT.json
      - docs/empirical/SNAPSHOT_JAPAN_GEOMETRY_AUTHORIZED
      - scripts/freeze_snapshot_japan_geometry.py
      - tests/test_empirical_snapshot_japan_geometry.py
      - .github/workflows/empirical-snapshot-japan-geometry-once.yml

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify response-blind geometry contract
        run: python -m pytest -q tests/test_empirical_snapshot_japan_geometry.py
      - name: Check geometry authorization
        id: auth
        run: |
          if [ -f docs/empirical/SNAPSHOT_JAPAN_GEOMETRY_AUTHORIZED ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze safe deployment geometry
        if: steps.auth.outputs.authorized == 'true'
        run: python scripts/freeze_snapshot_japan_geometry.py
      - name: Upload geometry certificate
        if: steps.auth.outputs.authorized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: empirical-snapshot-japan-geometry-${{ github.run_id }}
          path: artifacts/snapshot_japan_geometry.json
          if-no-files-found: error
