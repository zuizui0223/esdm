name: NeoBat M1-M2-M3 focal-null and corrected-WorldClim workflow path tests

on:
  push:
    branches:
      - analysis/neobat-m1-m3-and-source-gate-audit-20261119
    paths:
      - scripts/neobat_model_comparison_core.py
      - tests/test_neobat_model_comparison_core.py
      - tests/test_neobat_worldclim_corrected_workflow_paths.py
      - .github/workflows/neobat-worldclim-corrected-source-preflight.yml
      - .github/workflows/neobat-m1-m3-source-only-audit-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source_free_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical-only dependency
        run: python -m pip install numpy==2.2.6
      - name: Compile NeoBat model core and regression tests
        run: |
          python -m py_compile scripts/neobat_model_comparison_core.py
          python -m py_compile tests/test_neobat_model_comparison_core.py
          python -m py_compile tests/test_neobat_worldclim_corrected_workflow_paths.py
      - name: Evaluate frozen model core and M2 sidecar on synthetic known truth
        run: python -m unittest discover -s tests -p 'test_neobat_model_comparison_core.py' -v
      - name: Fail on corrected-source receipt path regressions
        run: python -m unittest discover -s tests -p 'test_neobat_worldclim_corrected_workflow_paths.py' -v
