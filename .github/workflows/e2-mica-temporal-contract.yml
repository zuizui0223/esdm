name: e2-mica-temporal-contract

on:
  pull_request:
    paths:
      - 'docs/replication/E2_MICA_TEMPORAL_INTEGRITY_CONTRACT.json'
      - 'src/esdm/validate/e2_mica_temporal_integrity.py'
      - 'scripts/audit_e2_mica_temporal_integrity.py'
      - 'tests/test_e2_mica_temporal_integrity.py'
      - 'tests/test_e2_mica_temporal_workflow.py'
      - 'docs/replication/E2_MICA_TEMPORAL_INTEGRITY_INFRASTRUCTURE_STOP_V1.json'
      - 'docs/replication/E2_MICA_TEMPORAL_INTEGRITY_REPLACEMENT_R2.json'
      - 'tests/test_e2_mica_temporal_r2_replacement.py'
      - '.github/workflows/e2-mica-temporal-integrity-once.yml'
      - '.github/workflows/e2-mica-temporal-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Validate temporal-only implementation without opening response
        run: >-
          python -m pytest -q
          tests/test_e2_mica_temporal_integrity.py
          tests/test_e2_mica_temporal_workflow.py
          tests/test_e2_mica_temporal_r2_replacement.py
      - name: Compile runner
        run: python -m py_compile scripts/audit_e2_mica_temporal_integrity.py
