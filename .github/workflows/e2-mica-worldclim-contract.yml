name: e2-mica-worldclim-contract

on:
  pull_request:
    paths:
      - 'docs/replication/E2_MICA_WORLDCLIM_CONTRACT.json'
      - 'src/esdm/validate/e2_mica_worldclim.py'
      - 'scripts/freeze_e2_mica_worldclim.py'
      - 'tests/test_e2_mica_worldclim.py'
      - '.github/workflows/e2-mica-worldclim-once.yml'
      - '.github/workflows/e2-mica-worldclim-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install climate test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install 'rasterio==1.5.0'
      - name: Validate response-blind climate implementation
        run: python -m pytest -q tests/test_e2_mica_worldclim.py
      - name: Compile climate runner
        run: python -m py_compile scripts/freeze_e2_mica_worldclim.py
