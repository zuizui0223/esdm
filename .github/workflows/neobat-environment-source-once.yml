name: NeoBat pinned WorldClim BIO1 BIO12 and elevation plus one ESA forest tile source check

on:
  push:
    branches:
      - analysis/neobat-abiotic-source-qualification-20261119
    paths:
      - docs/replication/neobat/NEOBAT_ENVIRONMENT_SOURCE_ONCE_20261119.txt

permissions:
  contents: write

jobs:
  source_only_abiotic_and_terrain:
    if: github.event.head_commit.message == 'dispatch frozen NeoBat environment-source-only qualification once' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/neobat-abiotic-source-qualification-20261119
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-only raster dependencies
        run: python -m pip install 'numpy==2.2.6' 'rasterio==1.4.3'
      - name: Validate synthetic original-shaped GeoTIFF source identity gates
        run: |
          test -f docs/replication/NEOBAT_ABIOTIC_TERRAIN_FOREST_SOURCE_PREFLIGHT_FROZEN_20261119.md
          python -m py_compile scripts/neobat_environment_source_preflight.py
          python -m unittest discover -s tests -p 'test_neobat_environment_source_preflight.py' -v
          python -m unittest discover -s tests -p 'test_neobat_worldclim_source_preflight.py' -v
      - name: Inspect official original WorldClim climate/elevation ZIPs and one ESA tile range
        run: |
          mkdir -p build/neobat
          set +e
          python -m scripts.neobat_environment_source_preflight \
            --out build/neobat/abiotic_terrain_forest_source_preflight.json
          status=$?
          set -e
          echo "$status" > build/neobat/abiotic_terrain_forest_source_preflight_exit_code.txt
          echo "NEOBAT_ENVIRONMENT_SOURCE_EXIT=$status"
      - name: Preserve no-raster-pixel aggregate source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neobat-worldclim-elev-forest-source-headers-only
          path: |
            build/neobat/abiotic_terrain_forest_source_preflight.json
            build/neobat/abiotic_terrain_forest_source_preflight_exit_code.txt
          retention-days: 90
          if-no-files-found: warn
      - name: Commit only original source signatures and nonbiological georaster metadata
        if: always()
        run: |
          set -euo pipefail
          test -f build/neobat/abiotic_terrain_forest_source_preflight.json
          cp build/neobat/abiotic_terrain_forest_source_preflight.json docs/replication/neobat/
          cp build/neobat/abiotic_terrain_forest_source_preflight_exit_code.txt docs/replication/neobat/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/replication/neobat/abiotic_terrain_forest_source_preflight*
          if ! git diff --cached --quiet; then
            git commit -m "evidence: pin WorldClim BIO1 BIO12 and elevation headers; report forest tile probe"
            git pull --rebase origin analysis/neobat-abiotic-source-qualification-20261119
            git push origin HEAD:analysis/neobat-abiotic-source-qualification-20261119
          fi
      - name: Never promote a source STOP to environmental source qualification
        run: |
          test "$(cat build/neobat/abiotic_terrain_forest_source_preflight_exit_code.txt)" = "0"
