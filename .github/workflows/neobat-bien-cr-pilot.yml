name: NeoBat BIEN Costa Rica plot source pilot
on:
  push:
    branches:
      - analysis/neobat-bien-cr-original-plot-pilot-20261121
    paths:
      - 'scripts/neobat_bien_cr_plot_pilot.R'
      - 'docs/replication/NEOBAT_INDEPENDENT_PLOT_CROSSWALK_INPUT_20261121.json'
      - '.github/workflows/neobat-bien-cr-pilot.yml'
  workflow_dispatch:
jobs:
  plot-country:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install BIEN and jsonlite
        run: Rscript -e 'install.packages(c("BIEN", "jsonlite"), repos="https://cloud.r-project.org")'
      - name: Fetch Costa Rica plot records and write source-only receipt
        timeout-minutes: 12
        run: |
          mkdir -p build/neobat
          Rscript scripts/neobat_bien_cr_plot_pilot.R \
            docs/replication/NEOBAT_INDEPENDENT_PLOT_CROSSWALK_INPUT_20261121.json \
            build/neobat/bien_cr_plot_pilot_receipt.json
      - name: Upload source-only receipt (no raw plot coordinates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neobat-bien-cr-source-only-receipt
          path: build/neobat/bien_cr_plot_pilot_receipt.json
          if-no-files-found: warn
          retention-days: 14
