name: NeoBat original 3 plant Colombia within-datasetKey background model once

on:
  push:
    branches:
      - analysis/neobat-plant-source-matched-colombia-pilot-20261119
    paths:
      - docs/replication/neobat/NEOBAT_PLANT_CO_DATASET_MATCHED_MODEL_ONCE_20261119.txt

permissions:
  contents: write
concurrency:
  group: neobat-plant-3sentinel-datasetmatched-once-20261119
  cancel-in-progress: false

jobs:
  source_matched_three_plant_fit:
    if: github.event.head_commit.message == 'dispatch frozen NeoBat three plant source dataset matched CO model once' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/neobat-plant-source-matched-colombia-pilot-20261119
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned projection source-model libraries
        run: |
          python -m pip install 'numpy==2.2.6' 'scikit-learn==1.7.2' 'rasterio==1.4.3' 'pyproj==3.7.2'
      - name: Freeze the fixed source-matching design and regression tests
        run: |
          test -f docs/replication/NEOBAT_SOURCE_DATASET_MATCHED_3PLANT_CO_PILOT_FROZEN_20261119.md
          test -f docs/replication/neobat/plant_dataset_matched_106x17_compact.json
          python -m py_compile scripts/neobat_plant_source_matched_co_pilot.py
          python -m unittest discover -s tests -p 'test_neobat_plant_source_matched_co_pilot.py' -v
      - name: Stream immutable GBIF original plant ZIP and WorldClim ZIPs for source-matched plant crossfit
        run: |
          mkdir -p build/neobat
          set +e
          python -m scripts.neobat_plant_source_matched_co_pilot \
            --out build/neobat/plant_CO_source_datasetmatched_pilot.json
          code=$?
          set -e
          echo "$code" > build/neobat/plant_CO_source_datasetmatched_pilot_exit_code.txt
          echo "NEOBAT_SOURCE_MATCHED_CO_MODEL_EXIT=$code"
      - name: Archive only aggregated sources and diagnostic AUC results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neobat-original-3plant-CO-datasetmatched-source-aggregate
          path: |
            build/neobat/plant_CO_source_datasetmatched_pilot.json
            build/neobat/plant_CO_source_datasetmatched_pilot_exit_code.txt
          if-no-files-found: warn
          retention-days: 90
      - name: Commit source-matched diagnostic only, not original plant coordinates
        if: always()
        run: |
          set -euo pipefail
          test -f build/neobat/plant_CO_source_datasetmatched_pilot.json
          cp build/neobat/plant_CO_source_datasetmatched_pilot* docs/replication/neobat/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/replication/neobat/plant_CO_source_datasetmatched_pilot*
          if ! git diff --cached --quiet; then
            git commit -m "evidence: first within-datasetKey plant CO source-matched AUC diagnostic"
            git pull --rebase origin analysis/neobat-plant-source-matched-colombia-pilot-20261119
            git push origin HEAD:analysis/neobat-plant-source-matched-colombia-pilot-20261119
          fi
      - name: Never promote source or model qualification stops
        run: |
          test "$(cat build/neobat/plant_CO_source_datasetmatched_pilot_exit_code.txt)" = "0"
