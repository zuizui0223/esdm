name: E7 read-only gradient and cycle transfer audit

on:
  pull_request:
    paths:
      - 'scripts/e7_pair_transfer_decomposition.py'
      - 'tests/test_e7_pair_transfer_decomposition.py'
      - '.github/workflows/e7-pair-transfer-decomposition.yml'

permissions:
  contents: read

jobs:
  aggregate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact algebra and synthetic stationary-diel counterexample
        run: |
          python -m pip install 'pytest>=8'
          python -m pytest -q tests/test_e7_pair_transfer_decomposition.py
      - name: Reconcile old E7 pair summary without reopening wildlife data
        run: |
          mkdir -p build/e7
          python -m scripts.e7_pair_transfer_decomposition \
            --pair-table docs/replication/E7_RELATIONAL_PAIRWISE_66.csv \
            --out build/e7/E7_PAIR_TRANSFER_DECOMPOSITION_RESULT.json
      - name: Preserve aggregate-only transferable-component receipt
        uses: actions/upload-artifact@v4
        with:
          name: e7-gradient-cycle-aggregate-${{ github.run_id }}
          path: build/e7/E7_PAIR_TRANSFER_DECOMPOSITION_RESULT.json
          if-no-files-found: error
          retention-days: 90
