name: E4 MICA exact sparse qualification once

concurrency:
  group: e4-mica-sparse-qualification-once
  cancel-in-progress: false

on:
  push:
    branches:
      - e4/mica-sparse-qualification-v1
    paths:
      - 'docs/replication/E4_MICA_SPARSE_QUALIFICATION_AUTHORIZED.json'

permissions:
  actions: read
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pure E4 qualification authorization
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          marker_path = Path(
              "docs/replication/E4_MICA_SPARSE_QUALIFICATION_AUTHORIZED.json"
          )
          marker = json.loads(marker_path.read_text(encoding="utf-8"))
          parent = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"], text=True
          ).strip()
          changed = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
              text=True,
          ).splitlines()
          if changed != [marker_path.as_posix()]:
              raise SystemExit("E4 qualification authorization must be marker-only")
          if marker["implementation_parent_sha"] != parent:
              raise SystemExit("E4 qualification parent mismatch")
          if marker["programme_id"] != "E4_MICA_SPARSE_NUTS":
              raise SystemExit("E4 qualification programme mismatch")
          if marker["contract_id"] != "e4-mica-exact-sparse-nuts-v1":
              raise SystemExit("E4 qualification contract mismatch")
          if marker["qualification_authorized"] is not True:
              raise SystemExit("E4 qualification is not explicitly authorized")
          if marker["empirical_fit_authorized"] is not False:
              raise SystemExit("E4 qualification marker may not authorize fitting")
          PY
      - name: Install package and validate sparse implementation
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q             tests/test_explicit_grid.py             tests/test_structural_exposure_compaction.py             tests/test_e4_mica_sparse_contract.py             tests/test_e4_mica_sparse_workflow.py
      - name: Download immutable E2 capture
        uses: actions/download-artifact@v4
        with:
          name: e2-mica-full-response-capture-36369531079
          path: captured/e2
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36369531079
      - name: Download immutable E3 reduced capture receipt
        uses: actions/download-artifact@v4
        with:
          name: e3-mica-exploratory-capture-36399428007
          path: captured/e3
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36399428007
      - name: Qualify exact sparse geometry without fitting
        run: |
          mkdir -p build/e4/qualification
          python scripts/qualify_e4_mica_sparse.py             --archive captured/e2/build/e2/source/mica-v3.zip             --climate captured/e2/frozen-climate/E2_MICA_WORLDCLIM_RESULT.json             --capture captured/e3/E3_MICA_EXPLORATORY_CAPTURE_RESULT.json             --out build/e4/qualification/E4_MICA_SPARSE_QUALIFICATION_RESULT.json
      - name: Upload immutable E4 qualification
        uses: actions/upload-artifact@v4
        with:
          name: e4-mica-sparse-qualification-${{ github.run_id }}
          path: build/e4/qualification/E4_MICA_SPARSE_QUALIFICATION_RESULT.json
          if-no-files-found: error
          retention-days: 90
