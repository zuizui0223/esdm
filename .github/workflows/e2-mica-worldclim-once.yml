name: E2 MICA WorldClim BIO12 once

on:
  push:
    branches:
      - e2/mica-worldclim-v1
    paths:
      - 'docs/replication/E2_MICA_WORLDCLIM_AUTHORIZED.json'

permissions:
  contents: read

jobs:
  climate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify pure climate authorization commit
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          marker_path = Path(
              "docs/replication/E2_MICA_WORLDCLIM_AUTHORIZED.json"
          )
          marker = json.loads(marker_path.read_text())
          parent = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"], text=True
          ).strip()
          if marker["implementation_parent_sha"] != parent:
              raise SystemExit("climate authorization parent mismatch")
          changed = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
              text=True,
          ).splitlines()
          if changed != [marker_path.as_posix()]:
              raise SystemExit(
                  "climate authorization commit must change only "
                  "E2_MICA_WORLDCLIM_AUTHORIZED.json"
              )
          if marker["candidate_id"] != "MICA_MUSKRAT":
              raise SystemExit("climate authorization candidate mismatch")
          if marker["stage"] != "response_blind_climate_only":
              raise SystemExit("climate authorization stage mismatch")
          if marker["one_shot"] is not True:
              raise SystemExit("climate authorization must be one-shot")
          if marker["full_response_authorized"] is not False:
              raise SystemExit("climate marker cannot authorize full response")
          PY

      - name: Install response-blind climate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install 'rasterio==1.5.0'

      - name: Download frozen MICA v3 archive
        run: |
          mkdir -p build/e2
          curl --fail --location --retry 3 --retry-delay 2             --output build/e2/mica-v3.zip             'https://ipt.inbo.be/archive.do?r=mica-agouti&v=3'

      - name: Download frozen WorldClim v2.1 BIO12 archive
        run: |
          curl --fail --location --retry 3 --retry-delay 2             --output build/e2/wc2.1_10m_bio.zip             'https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_bio.zip'

      - name: Freeze response-blind MICA climate
        run: |
          python scripts/freeze_e2_mica_worldclim.py             --mica-archive build/e2/mica-v3.zip             --worldclim-archive build/e2/wc2.1_10m_bio.zip             --out build/e2/E2_MICA_WORLDCLIM_RESULT.json

      - name: Assert response firewall remains closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("build/e2/E2_MICA_WORLDCLIM_RESULT.json").read_text()
          )
          if result["status"] not in {
              "CLIMATE_QUALIFIED",
              "STOP_PRE_RESPONSE_CLIMATE_TRANSPORT_OR_SCHEMA",
          }:
              raise SystemExit(f"unexpected climate status {result['status']}")
          firewall = result["response_firewall"]
          if firewall["observation_rows_read_for_climate"] != 0:
              raise SystemExit("climate stage opened observation rows")
          for key in (
              "scientific_name_values_read",
              "count_values_read",
              "focal_taxon_filtering",
              "full_response_opened",
          ):
              if firewall[key] is not False:
                  raise SystemExit(f"climate firewall drifted: {key}")
          if firewall["model_fits"] != 0 or firewall["heldout_scores"] != 0:
              raise SystemExit("climate stage performed forbidden model work")
          if result["decision"]["authorizes_full_response"] is not False:
              raise SystemExit("climate result cannot self-authorize full response")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2-mica-worldclim-${{ github.run_id }}
          path: build/e2/E2_MICA_WORLDCLIM_RESULT.json
          if-no-files-found: error
          retention-days: 90
