name: v0.3.1 frozen Gate C knockout full run

on:
  push:
    branches:
      - feature/v031-identification-fixes
    paths:
      - .github/workflows/v031-knockout-full-once.yml

jobs:
  gate-c:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[inference]"
      - name: Run frozen Gate C neutral knockout benchmark
        run: python scripts/run_v031_knockout.py --output artifacts/v031_knockout.json
      - name: Upload Gate C audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v031-gate-c-${{ github.run_id }}
          path: artifacts/v031_knockout.json
          if-no-files-found: error
