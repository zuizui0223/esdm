name: v0.6b frozen joint identification audit

on:
  push:
    branches:
      - feature/v06b-joint-identification-audit
    paths:
      - .github/workflows/v06b-joint-identification-once.yml
      - docs/validation/V06B_RUN_AUTHORIZED
      - docs/validation/V06B_JOINT_IDENTIFICATION_AUDIT.md
      - scripts/run_v06b_joint_audit.py
      - src/esdm/validate/v06b_joint_audit.py
      - tests/test_v06b_*.py

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,inference]"
      - name: Check explicit v0.6b authorization
        id: authorization
        run: |
          if [ -f docs/validation/V06B_RUN_AUTHORIZED ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify frozen v0.6b contracts
        run: |
          python -m pytest -q             tests/test_v06b_joint_audit.py             tests/test_v06b_gate_freeze.py             tests/test_v06b_scripts.py             tests/test_v06b_workflow.py

  audit:
    needs: precheck
    if: needs.precheck.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,inference]"
      - name: Run frozen v0.6b audit
        run: |
          mkdir -p artifacts
          python scripts/run_v06b_joint_audit.py             --output artifacts/v06b_joint_audit.json
      - name: Upload v0.6b audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v06b-joint-audit-${{ github.run_id }}
          path: artifacts/v06b_joint_audit.json
          if-no-files-found: error
