name: E5 Kays41 raw detection header once

concurrency:
  group: e5-kays41-raw-header-once
  cancel-in-progress: false

on:
  push:
    branches:
      - e5/kays41-raw-header-v1
    paths:
      - 'docs/replication/E5_KAYS41_RAW_HEADER_AUTHORIZED.json'

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify pure one-shot header authorization
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          marker_path = Path("docs/replication/E5_KAYS41_RAW_HEADER_AUTHORIZED.json")
          marker = json.loads(marker_path.read_text(encoding="utf-8"))
          parent = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"], text=True
          ).strip()
          changed = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
              text=True,
          ).splitlines()
          contract_path = Path("docs/replication/E5_KAYS41_RAW_HEADER_CONTRACT.json")
          contract_blob = subprocess.check_output(
              ["git", "hash-object", str(contract_path)], text=True
          ).strip()

          if changed != [marker_path.as_posix()]:
              raise SystemExit("authorization commit must change only marker")
          if marker.get("implementation_parent_sha") != parent:
              raise SystemExit("implementation parent mismatch")
          if marker.get("programme_id") != "E5_INDEPENDENT_ACTIVITY_DETECTION":
              raise SystemExit("programme mismatch")
          if marker.get("candidate_id") != "kays41_emammal_team_2020":
              raise SystemExit("candidate mismatch")
          if marker.get("contract_id") != (
              "e5-kays41-spatial-raw-header-response-blind-v1"
          ):
              raise SystemExit("contract id mismatch")
          if marker.get("contract_blob_sha") != (
              "136e1c98dafd5f67ddf1ad8244989b1efcbd0ab0"
          ):
              raise SystemExit("contract blob pin mismatch")
          if contract_blob != marker["contract_blob_sha"]:
              raise SystemExit("working-tree contract blob mismatch")
          if marker.get("precheck_authorized") is not True:
              raise SystemExit("precheck not authorized")
          if marker.get("one_shot") is not True:
              raise SystemExit("authorization must be one-shot")
          if marker.get("header_line_read_authorized") is not True:
              raise SystemExit("header line not authorized")
          if marker.get("data_row_read_authorized") is not False:
              raise SystemExit("data rows remain forbidden")
          if marker.get("focal_response_opening_authorized") is not False:
              raise SystemExit("focal response remains forbidden")
          if marker.get("model_fitting_authorized") is not False:
              raise SystemExit("model fitting remains forbidden")
          PY

      - name: Compile and unit-test header precheck
        run: |
          python -m py_compile scripts/precheck_e5_kays41_raw_header.py
          python -m pip install -q pytest
          python -m pytest -q tests/test_e5_kays41_raw_header.py

      - name: Execute one-shot header-only precheck
        run: |
          mkdir -p build/public
          python scripts/precheck_e5_kays41_raw_header.py \
            --contract docs/replication/E5_KAYS41_RAW_HEADER_CONTRACT.json \
            --out build/public/E5_KAYS41_RAW_HEADER_RESULT.json

      - name: Verify terminal response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(
              Path("build/public/E5_KAYS41_RAW_HEADER_RESULT.json")
              .read_text(encoding="utf-8")
          )
          b = value["response_boundary"]
          assert b["header_lines_read"] in (0, 1)
          assert b["data_rows_read"] == 0
          assert b["response_values_read"] == 0
          assert b["species_values_read"] == 0
          assert b["focal_response_opened"] is False
          assert value["decision"]["candidate_qualified"] is False
          assert value["decision"]["same_authorization_rerun_allowed"] is False
          assert value["decision"]["G2_pass_authorized"] is False
          assert value["decision"]["G3_pass_authorized"] is False
          assert value["decision"]["G4_pass_authorized"] is False
          assert value["decision"]["focal_response_opening_authorized"] is False
          assert value["decision"]["model_fitting_authorized"] is False
          PY

      - name: Upload result only
        uses: actions/upload-artifact@v4
        with:
          name: e5-kays41-raw-header-${{ github.run_id }}
          path: build/public/E5_KAYS41_RAW_HEADER_RESULT.json
          if-no-files-found: error
          retention-days: 90
