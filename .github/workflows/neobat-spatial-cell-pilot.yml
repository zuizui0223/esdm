name: NeoBat 14-taxon bat+plant coordinate grid feasibility pilot

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/neobat-spatial-cell-pilot.yml

permissions:
  contents: write

concurrency:
  group: neobat-spatial-cell-pilot-20261119
  cancel-in-progress: false

jobs:
  bat_plant_spatial_cell_pilot:
    if: github.event.pull_request.number == 244 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic geometry and run source-independent tests
        run: |
          python -m pip install 'pyproj==3.7.2'
          python -m py_compile scripts/neobat_spatial_cell_pilot.py
          python -m unittest discover -s tests -p 'test_neobat_spatial_cell_pilot.py' -v
      - name: Read-only indexed GBIF occurrence spatial-cell pilot
        run: |
          mkdir -p build/neobat
          set +e
          python -m scripts.neobat_spatial_cell_pilot --out build/neobat/spatial_cell_pilot.json
          rc=$?
          set -e
          echo "$rc" > build/neobat/spatial_cell_pilot_exit_code.txt
          echo "GBIF coordinate-cell pilot terminal exit code: $rc"
      - name: Upload aggregate grids, no raw occurrence coordinates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neobat-spatial-cell-pilot
          path: build/neobat/
          if-no-files-found: warn
          retention-days: 90
      - name: Save receipt on isolated design branch
        if: success()
        run: |
          set -euo pipefail
          mkdir -p docs/replication/neobat
          cp build/neobat/spatial_cell_pilot.json docs/replication/neobat/
          cp build/neobat/spatial_cell_pilot_exit_code.txt docs/replication/neobat/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/replication/neobat
          if ! git diff --cached --quiet; then
            git commit -m "evidence: 14 fixed taxa GBIF 25/50km cell availability, DOI still blocked"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
