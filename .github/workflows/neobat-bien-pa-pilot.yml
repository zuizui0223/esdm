name: NeoBat BIEN Panama plot source pilot
on:
  push:
    branches:
      - analysis/neobat-bien-pa-original-plot-pilot-20261121
    paths:
      - 'scripts/neobat_bien_pa_plot_pilot.R'
      - 'docs/replication/NEOBAT_INDEPENDENT_PLOT_CROSSWALK_INPUT_20261121.json'
      - '.github/workflows/neobat-bien-pa-pilot.yml'
  workflow_dispatch:
jobs:
  plot-country:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install geospatial system libraries required by BIEN
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev libsqlite3-dev libnetcdf-dev
      - name: Install BIEN and jsonlite
        run: Rscript -e 'install.packages(c("BIEN", "jsonlite"), repos="https://cloud.r-project.org"); stopifnot(requireNamespace("BIEN", quietly=TRUE))'
      - name: Fetch Panama plot records and write source-only receipt
        timeout-minutes: 10
        run: |
          mkdir -p build/neobat
          Rscript scripts/neobat_bien_pa_plot_pilot.R \
            docs/replication/NEOBAT_INDEPENDENT_PLOT_CROSSWALK_INPUT_20261121.json \
            build/neobat/bien_pa_plot_pilot_receipt.json
      - name: Upload source-only receipt (no raw plot coordinates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neobat-bien-pa-source-only-receipt
          path: build/neobat/bien_pa_plot_pilot_receipt.json
          if-no-files-found: warn
          retention-days: 14
