name: E5 Sumatra focal_species header resolver once

concurrency:
  group: e5-sumatra-focal-headers-once
  cancel-in-progress: false

on:
  push:
    branches:
      - e5/sumatra-focal-headers-v1
    paths:
      - 'docs/replication/E5_SUMATRA_FOCAL_HEADERS_AUTHORIZED.json'

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify pure one-shot header authorization
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          marker_path = Path(
              "docs/replication/E5_SUMATRA_FOCAL_HEADERS_AUTHORIZED.json"
          )
          marker = json.loads(marker_path.read_text(encoding="utf-8"))
          parent = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"], text=True
          ).strip()
          changed = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
              text=True,
          ).splitlines()
          contract_path = Path(
              "docs/replication/E5_SUMATRA_FOCAL_HEADERS_CONTRACT.json"
          )
          contract_blob = subprocess.check_output(
              ["git", "hash-object", str(contract_path)], text=True
          ).strip()

          if changed != [marker_path.as_posix()]:
              raise SystemExit("authorization commit must change only marker")
          if marker.get("implementation_parent_sha") != parent:
              raise SystemExit("implementation parent mismatch")
          if marker.get("programme_id") != "E5_INDEPENDENT_ACTIVITY_DETECTION":
              raise SystemExit("programme mismatch")
          if marker.get("candidate_id") != "sumatra_mesopredator_paired_2014_2015":
              raise SystemExit("candidate mismatch")
          if marker.get("contract_id") != (
              "e5-sumatra-focal-header-sharedstrings-response-blind-v1"
          ):
              raise SystemExit("contract id mismatch")
          if marker.get("contract_blob_sha") != "df6824b8e09b999799425173f1f1bedcdca99642":
              raise SystemExit("contract blob pin mismatch")
          if contract_blob != marker["contract_blob_sha"]:
              raise SystemExit("working-tree contract blob mismatch")
          if marker.get("precheck_authorized") is not True:
              raise SystemExit("precheck not authorized")
          if marker.get("one_shot") is not True:
              raise SystemExit("authorization must be one-shot")
          if marker.get("target_indices") != [0, 1, 2, 3, 4]:
              raise SystemExit("target indices drifted")
          if marker.get("focal_species_data_rows_authorized") is not False:
              raise SystemExit("focal data rows remain forbidden")
          if marker.get("focal_response_values_authorized") is not False:
              raise SystemExit("focal response values remain forbidden")
          PY

      - name: Compile header resolver
        run: python -m py_compile scripts/precheck_e5_sumatra_focal_headers.py

      - name: Download pinned PLOS S1 archive
        run: |
          mkdir -p build/private build/public
          curl --location --fail --retry 3 --retry-delay 2 \
            'https://journals.plos.org/plosone/article/file?id=10.1371%2Fjournal.pone.0202876.s001&type=supplementary' \
            --output build/private/sumatra_s1.zip

      - name: Resolve only pre-frozen focal header indices
        run: |
          python scripts/precheck_e5_sumatra_focal_headers.py \
            --archive build/private/sumatra_s1.zip \
            --contract docs/replication/E5_SUMATRA_FOCAL_HEADERS_CONTRACT.json \
            --out build/public/E5_SUMATRA_FOCAL_HEADERS_RESULT.json

      - name: Verify response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(
              Path("build/public/E5_SUMATRA_FOCAL_HEADERS_RESULT.json")
              .read_text(encoding="utf-8")
          )
          scan = value["streaming_scan"]
          boundary = value["response_boundary"]
          assert value["frozen_targets"]["shared_string_indices"] == [0, 1, 2, 3, 4]
          assert scan["shared_string_entries_traversed"] == 5
          assert scan["target_count_resolved"] == 5
          assert scan["non_target_values_retained"] == 0
          assert scan["non_target_values_reported"] == 0
          assert scan["entries_after_max_target_parsed"] == 0
          assert boundary["worksheet_xml_opened"] is False
          assert boundary["focal_species_data_rows_read"] == 0
          assert boundary["other_species_sheet_rows_read"] == 0
          assert boundary["site_cov_data_rows_read"] == 0
          assert boundary["data_rows_read"] == 0
          assert boundary["response_rows_read"] == 0
          assert boundary["focal_response_values_read"] == 0
          assert value["decision"]["candidate_qualified"] is False
          PY

      - name: Destroy response-bearing archive before upload
        run: |
          rm -f build/private/sumatra_s1.zip
          test ! -e build/private/sumatra_s1.zip

      - name: Upload header result only
        uses: actions/upload-artifact@v4
        with:
          name: e5-sumatra-focal-headers-${{ github.run_id }}
          path: build/public/E5_SUMATRA_FOCAL_HEADERS_RESULT.json
          if-no-files-found: error
          retention-days: 90
