name: v0.7h deterministic expected-record match

on:
  push:
    branches:
      - feature/v07h-expected-record-match
    paths:
      - .github/workflows/v07h-expected-record-match.yml
      - scripts/run_v07h_diagnostic.py
      - src/esdm/validate/v07h_*.py
      - tests/test_v07h_*.py

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,inference]"
      - name: Test expected-record matching contracts
        run: |
          python -m pytest -q tests/test_v07h_fixture.py
      - name: Evaluate expected-record matched designs
        run: |
          mkdir -p artifacts
          python scripts/run_v07h_diagnostic.py             --output artifacts/v07h_diagnostic.json
      - name: Upload deterministic diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: v07h-diagnostic-${{ github.run_id }}
          path: artifacts/v07h_diagnostic.json
          if-no-files-found: error
