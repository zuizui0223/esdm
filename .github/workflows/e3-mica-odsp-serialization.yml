name: E3 MICA ODSP serialization

on:
  pull_request:
    paths:
      - 'src/esdm/transfer/odsp_adapter.py'
      - 'src/esdm/transfer/__init__.py'
      - 'docs/replication/E3_MICA_ODSP_SERIALIZATION_CONTRACT.json'
      - 'tests/test_e3_mica_odsp_serialization.py'
      - 'tests/test_e3_mica_odsp_serialization_contract.py'
      - '.github/workflows/e3-mica-odsp-serialization.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Validate E3 ODSP serialization boundary
        run: >-
          python -m pytest -q
          tests/test_e3_mica_odsp_serialization.py
          tests/test_e3_mica_odsp_serialization_contract.py
