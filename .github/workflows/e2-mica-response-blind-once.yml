name: E2 MICA response-blind geometry-header once

on:
  push:
    branches:
      - e2/mica-response-blind-v1
    paths:
      - 'docs/replication/E2_MICA_RESPONSE_BLIND_AUTHORIZED.json'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify authorization commit purity and parent binding
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          marker_path = Path("docs/replication/E2_MICA_RESPONSE_BLIND_AUTHORIZED.json")
          marker = json.loads(marker_path.read_text())

          parent = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"],
              text=True,
          ).strip()
          if marker["implementation_parent_sha"] != parent:
              raise SystemExit(
                  f"authorization parent mismatch: {marker['implementation_parent_sha']} != {parent}"
              )

          changed = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
              text=True,
          ).splitlines()
          if changed != [marker_path.as_posix()]:
              raise SystemExit(
                  "authorization commit must add/change only "
                  "E2_MICA_RESPONSE_BLIND_AUTHORIZED.json"
              )
          if marker["candidate_id"] != "MICA_MUSKRAT":
              raise SystemExit("authorization candidate mismatch")
          if marker["one_shot"] is not True:
              raise SystemExit("authorization must declare one_shot=true")
          PY

      - name: Install package
        run: python -m pip install -e .

      - name: Download frozen public MICA v3 Camtrap DP archive
        run: |
          mkdir -p build/e2
          curl             --fail             --location             --retry 3             --retry-delay 2             --output build/e2/mica-v3.zip             'https://ipt.inbo.be/archive.do?r=mica-agouti&v=3'

      - name: Run response-blind geometry/header qualification
        run: |
          python scripts/qualify_e2_mica_response_blind.py             --archive build/e2/mica-v3.zip             --out build/e2/E2_MICA_RESPONSE_BLIND_GEOMETRY_HEADER_RESULT.json

      - name: Assert response boundary remains closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("build/e2/E2_MICA_RESPONSE_BLIND_GEOMETRY_HEADER_RESULT.json").read_text()
          )
          if result["status"] != "RESPONSE_BLIND_GEOMETRY_HEADER_PASS":
              raise SystemExit(f"pre-response qualification did not pass: {result['status']}")
          boundary = result["response_boundary"]
          expected_false = [
              "scientific_name_values_read",
              "count_values_read",
              "state_values_read",
              "taxon_frequencies_computed",
              "focal_event_counts_computed",
              "authorizes_temporal_opening",
              "authorizes_full_response_opening",
          ]
          if boundary["observations_data_rows_read"] != 0:
              raise SystemExit("observation response rows were opened")
          for key in expected_false:
              if boundary[key] is not False:
                  raise SystemExit(f"response boundary drifted: {key}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2-mica-response-blind-${{ github.run_id }}
          path: build/e2/E2_MICA_RESPONSE_BLIND_GEOMETRY_HEADER_RESULT.json
          if-no-files-found: error
          retention-days: 90
