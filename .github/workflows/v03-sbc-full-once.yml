name: v0.3 frozen SBC full run

on:
  push:
    branches:
      - feature/v03-known-truth-benchmark
    paths:
      - .github/workflows/v03-sbc-full-once.yml

jobs:
  sbc:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[inference]"
      - name: Run frozen 100-replicate SBC
        run: |
          python scripts/run_v03_sbc.py \
            --replicates 100 \
            --base-seed 20260917 \
            --num-warmup 250 \
            --num-samples 300 \
            --bins 10 \
            --output artifacts/v03_sbc_full.json
      - name: Upload frozen SBC artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v03-sbc-full-${{ github.run_id }}
          path: artifacts/v03_sbc_full.json
          if-no-files-found: error
