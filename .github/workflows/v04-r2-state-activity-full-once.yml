name: v0.4-R2 frozen hard state activity full run

on:
  push:
    branches:
      - feature/v04-frozen-validation-r2
    paths:
      - .github/workflows/v04-r2-state-activity-full-once.yml
      - docs/validation/V04_R2_RUN_AUTHORIZED
      - scripts/run_v04_r2_state_activity.py
      - src/esdm/model/backend_numpyro.py
      - src/esdm/model/compose.py
      - src/esdm/observe/effort.py
      - src/esdm/observe/presence_only.py
      - src/esdm/observe/state_annotated.py
      - src/esdm/identify/design_rank.py
      - src/esdm/validate/v04_r2_state_activity.py
      - src/esdm/validate/v04_r2_gate.py
      - src/esdm/validate/v04_r2_run.py
      - tests/test_v04_r2_*.py

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation and inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,inference]"
      - name: Check explicit R2 outcome authorization
        id: authorization
        run: |
          if [ -f docs/validation/V04_R2_RUN_AUTHORIZED ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify frozen v0.4-R2 contracts
        run: |
          python -m pytest -q \
            tests/test_v04_process_contract.py \
            tests/test_v04_activity_process.py \
            tests/test_v04_state_process.py \
            tests/test_v04_latent_channels.py \
            tests/test_v04_observation_blocks.py \
            tests/test_v04_state_annotated.py \
            tests/test_v04_simulation.py \
            tests/test_v04_numpyro.py \
            tests/test_v04_identifiability.py \
            tests/test_v04_jax_scaling.py \
            tests/test_v04_r2_effort.py \
            tests/test_v04_r2_presence_detection.py \
            tests/test_v04_r2_fixture.py \
            tests/test_v04_r2_identification.py \
            tests/test_v04_r2_gate.py \
            tests/test_v04_r2_run.py \
            tests/test_v04_r2_script.py \
            tests/test_v04_r2_workflow.py

  gate-v04-r2:
    needs: precheck
    if: needs.precheck.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize fail-closed R2 audit artifact
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os
          payload = {
              "schema": "esdm.v04_r2.state_activity_gate.v1",
              "git_sha": os.environ.get("GITHUB_SHA"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "gate_freeze_commit": "9e6db6fbe8336c6eb8bbe354713d2863fc40033f",
              "status": "INFRASTRUCTURE_BLOCKED",
              "infrastructure_block": {
                  "stage": "workflow_precheck",
                  "reason": "benchmark did not yet overwrite the fail-closed placeholder",
              },
          }
          with open(
              "artifacts/v04_r2_state_activity_gate.json",
              "w",
              encoding="utf-8",
          ) as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - name: Install validation and inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,inference]"
      - name: Run frozen v0.4-R2 hard separation benchmark
        run: |
          python scripts/run_v04_r2_state_activity.py --output artifacts/v04_r2_state_activity_gate.json
      - name: Upload v0.4-R2 gate audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v04-r2-state-activity-${{ github.run_id }}
          path: artifacts/v04_r2_state_activity_gate.json
          if-no-files-found: error
