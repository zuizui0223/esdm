name: NeoBat v3 original 35 source-disjoint plant fruit partner gate once

on:
  push:
    branches:
      - analysis/neobat-source35-partner-retention-20261119
    paths:
      - docs/replication/neobat/NEOBAT_V3_GLOBAL_SOURCE35_PARTNERS_ONCE_20261119.txt

permissions:
  contents: write

concurrency:
  group: neobat-v3-35partner-oneshot-20261119
  cancel-in-progress: false

jobs:
  original_35_partner_feasibility:
    if: github.event.head_commit.message == 'dispatch frozen NeoBat v3 original 35-plant partner source gate once' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/neobat-source35-partner-retention-20261119
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original immutable design and source-free correctness
        run: |
          set -euo pipefail
          test -f docs/replication/NEOBAT_V3_SOURCE35_PARTNER_FEASIBILITY_FROZEN_20261119.md
          test -f docs/replication/neobat/plant_106x17_global_source_embargo.json
          test -f docs/replication/neobat/v2_106plant_reference_input_gate.json
          python -m py_compile scripts/neobat_v3_source35_partner_gate.py
          python -m unittest discover -s tests -p 'test_neobat_v3_source35_partner_gate.py' -v
      - name: Verify original NeoBat authored source and all 84 fixed folds
        run: |
          mkdir -p build/neobat
          set +e
          python -m scripts.neobat_v3_source35_partner_gate \
            --out build/neobat/v3_source_disjoint35_partner_gate.json
          status=$?
          set -e
          echo "$status" > build/neobat/v3_source_disjoint35_partner_gate_exit_code.txt
          echo "NEOBAT_SOURCE35_ORIGINAL_GATE_EXIT=$status"
      - name: Preserve aggregate only, no original occurrences or source IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neobat-v3-original35-fruitpartner-sourcegate-aggregate
          path: |
            build/neobat/v3_source_disjoint35_partner_gate.json
            build/neobat/v3_source_disjoint35_partner_gate_exit_code.txt
          if-no-files-found: warn
          retention-days: 90
      - name: Commit only source partner/ref counts and sorted public plant names
        if: always()
        run: |
          set -euo pipefail
          test -f build/neobat/v3_source_disjoint35_partner_gate.json
          cp build/neobat/v3_source_disjoint35_partner_gate.json docs/replication/neobat/
          cp build/neobat/v3_source_disjoint35_partner_gate_exit_code.txt docs/replication/neobat/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/replication/neobat/v3_source_disjoint35_partner_gate*
          if ! git diff --cached --quiet; then
            git commit -m "evidence: fixed 35 source-disjoint fruit partner and N1 feasibility with 84 fold stops"
            git pull --rebase origin analysis/neobat-source35-partner-retention-20261119
            git push origin HEAD:analysis/neobat-source35-partner-retention-20261119
          fi
      - name: Fail closed on any source or denominator error
        run: |
          test "$(cat build/neobat/v3_source_disjoint35_partner_gate_exit_code.txt)" = "0"
