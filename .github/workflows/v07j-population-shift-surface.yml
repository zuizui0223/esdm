name: v0.7j population-shift sensitivity surface

on:
  push:
    branches:
      - feature/v07j-population-shift-surface
    paths:
      - .github/workflows/v07j-population-shift-surface.yml
      - scripts/run_v07j_surface.py
      - src/esdm/validate/v07j_*.py
      - tests/test_v07j_*.py

jobs:
  surface:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,inference]"
      - name: Test v0.7j surface contracts
        run: |
          python -m pytest -q tests/test_v07j_surface.py
      - name: Evaluate frozen truth grid
        run: |
          mkdir -p artifacts
          python scripts/run_v07j_surface.py             --output artifacts/v07j_surface.json
      - name: Upload v0.7j surface
        uses: actions/upload-artifact@v4
        with:
          name: v07j-surface-${{ github.run_id }}
          path: artifacts/v07j_surface.json
          if-no-files-found: error
