name: External CamtrapDP temporal-boundary replication

concurrency:
  group: camtrapdp-external-temporal-boundary
  cancel-in-progress: false

on:
  push:
    branches:
      - replication/camtrapdp-external-temporal-boundary
    paths:
      - docs/replication/CAMTRAPDP_EXTERNAL_TEMPORAL_AUDIT_CONTRACT.json
      - docs/replication/CAMTRAPDP_EXTERNAL_TEMPORAL_AUDIT_AUTHORIZED
      - scripts/audit_external_camtrapdp_temporal_boundary.py
      - tests/test_external_camtrapdp_temporal_audit.py
      - .github/workflows/camtrapdp-external-temporal-audit-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify external replication contract
        run: python -m pytest -q tests/test_external_camtrapdp_temporal_audit.py
      - name: Verify newly-added authorization
        id: auth
        run: |
          marker=docs/replication/CAMTRAPDP_EXTERNAL_TEMPORAL_AUDIT_AUTHORIZED
          if [ ! -f "$marker" ]; then
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --diff-filter=A --name-only HEAD^ HEAD | grep -Fxq "$marker"; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorization marker was not newly added" >&2
            exit 1
          fi
      - name: Run independent temporal-boundary audit
        if: steps.auth.outputs.authorized == 'true'
        run: python scripts/audit_external_camtrapdp_temporal_boundary.py
      - name: Upload audit result
        if: steps.auth.outputs.authorized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: camtrapdp-external-temporal-audit-${{ github.run_id }}
          path: artifacts/camtrapdp_external_temporal_audit.json
          if-no-files-found: error
          retention-days: 90
