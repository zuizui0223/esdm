name: Safari14 frozen-aggregate structural null audit

on:
  pull_request:
    paths:
      - '.github/workflows/safari14-structural-null.yml'
      - 'scripts/safari14_structural_null_sensitivity.py'
      - 'tests/test_safari14_structural_null_sensitivity.py'

permissions:
  contents: read
  actions: read

jobs:
  source-frozen-null-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test null model algebra and source firewall
        run: |
          python -m pip install 'pytest>=8'
          python -m pytest -q tests/test_safari14_structural_null_sensitivity.py
      - name: Download ONLY the previously frozen 39KB aggregate S14 result
        uses: actions/download-artifact@v4
        with:
          name: safari14-spatial-beta-42848095854
          path: source/safari14_frozen
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 42848095854
      - name: Validate original empirical result hash and run all three artificial nulls
        run: |
          set -euo pipefail
          echo 'f9d263daa232651d9337f4d4125ae54ff34dcb248a91aef7ee7be75578cff6c7  source/safari14_frozen/SAFARI14_SPATIAL_BETA_RESULT.json' | sha256sum --check
          mkdir -p build/safari14_null
          python -m scripts.safari14_structural_null_sensitivity \
            --original-result source/safari14_frozen/SAFARI14_SPATIAL_BETA_RESULT.json \
            --out build/safari14_null/SAFARI14_STRUCTURAL_NULL_RESULT.json
      - name: Preserve 500-draw aggregate-only retrospective sensitivity
        uses: actions/upload-artifact@v4
        with:
          name: safari14-structural-null-${{ github.run_id }}
          path: build/safari14_null/SAFARI14_STRUCTURAL_NULL_RESULT.json
          if-no-files-found: error
          retention-days: 90
