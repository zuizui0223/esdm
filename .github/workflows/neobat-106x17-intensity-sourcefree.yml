name: NeoBat 106x17 source-intensity full diagnostic source-free regression
on:
  push:
    branches:
      - analysis/neobat-106x17-source-intensity-diagnostic-20261119
    paths:
      - scripts/neobat_plant_106x17_intensity_diagnostic.py
      - tests/test_neobat_plant_106x17_intensity_diagnostic.py
      - .github/workflows/neobat-106x17-intensity-sourcefree.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source-free numerical dependencies
        run: python -m pip install 'numpy==2.2.6' 'scikit-learn==1.7.2'
      - name: Run synthetic 106x17 country process / prior fixed pilot equivalence tests
        run: |
          test -f docs/replication/NEOBAT_106x17_SOURCE_INTENSITY_FULL_DIAGNOSTIC_FROZEN_20261119.md
          python -m py_compile scripts/neobat_plant_106x17_intensity_diagnostic.py
          python -m unittest discover -s tests -p 'test_neobat_plant_106x17_intensity_diagnostic.py' -v
