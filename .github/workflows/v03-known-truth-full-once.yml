name: v0.3 frozen known-truth full run

on:
  push:
    branches:
      - feature/v03-known-truth-benchmark
    paths:
      - .github/workflows/v03-known-truth-full-once.yml

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[inference]"
      - name: Run frozen 100-replicate benchmark
        run: |
          python scripts/run_v03_known_truth.py \
            --replicates 100 \
            --base-seed 20260916 \
            --num-warmup 250 \
            --num-samples 300 \
            --credible-mass 0.90 \
            --output artifacts/v03_known_truth_full.json
      - name: Upload frozen benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v03-known-truth-full-${{ github.run_id }}
          path: artifacts/v03_known_truth_full.json
          if-no-files-found: error
