name: E3 MICA reduced result import

on:
  workflow_run:
    workflows:
      - E3 MICA reduced exploratory fit once
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify authorized E3 workflow-run identity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          contract = json.loads(
              Path("docs/replication/E3_MICA_REDUCED_RESULT_IMPORT_CONTRACT.json").read_text()
          )
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          run = event["workflow_run"]
          frozen = contract["authorized_execution"]
          if int(run["id"]) != int(frozen["workflow_run_id"]):
              raise SystemExit("workflow_run id is not the frozen E3 execution")
          if int(run["run_attempt"]) != int(frozen["run_attempt"]):
              raise SystemExit("workflow_run attempt drifted")
          if str(run["head_sha"]) != str(frozen["authorization_head_sha"]):
              raise SystemExit("workflow_run head SHA drifted")
          if str(run["head_branch"]) != str(frozen["authorization_branch"]):
              raise SystemExit("workflow_run branch drifted")
          PY

      - name: Install eSDM import validator
        run: python -m pip install -e '.[dev]'

      - name: Resolve frozen E3 result artifact provenance
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          contract = json.loads(
              Path("docs/replication/E3_MICA_REDUCED_RESULT_IMPORT_CONTRACT.json").read_text()
          )
          run_id = int(contract["authorized_execution"]["workflow_run_id"])
          expected_name = f"e3-mica-reduced-result-{run_id}"
          url = (
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{run_id}/artifacts"
          )
          request = Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urlopen(request, timeout=60) as response:
              payload = json.load(response)
          matches = [
              row for row in payload.get("artifacts", [])
              if row.get("name") == expected_name and not row.get("expired")
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one non-expired {expected_name!r} artifact, "
                  f"found {len(matches)}"
              )
          row = matches[0]
          digest = str(row.get("digest") or "")
          if not digest.startswith("sha256:"):
              raise SystemExit("E3 artifact is missing sha256 digest")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"id={int(row['id'])}\n")
              handle.write(f"name={expected_name}\n")
              handle.write(f"digest={digest}\n")
              handle.write(f"run_id={run_id}\n")
          PY

      - name: Download immutable E3 result artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact.outputs.run_id }}

      - name: Validate and freeze E3 result receipt
        run: |
          mkdir -p build/import
          python scripts/freeze_e3_mica_reduced_result.py             --result build/source/E3_MICA_REDUCED_EMPIRICAL_RESULT.json             --artifact-id ${{ steps.artifact.outputs.id }}             --artifact-name ${{ steps.artifact.outputs.name }}             --artifact-digest '${{ steps.artifact.outputs.digest }}'             --out build/import/E3_MICA_REDUCED_FROZEN_RESULT.json

      - name: Upload frozen E3 import receipt
        uses: actions/upload-artifact@v4
        with:
          name: e3-mica-reduced-frozen-import-v1
          path: build/import/E3_MICA_REDUCED_FROZEN_RESULT.json
          if-no-files-found: error
          retention-days: 90
