name: odsp-transfer-v07b-e2e

on:
  pull_request:
    paths:
      - 'docs/validation/V07B_FROZEN_RESULTS.json'
      - 'ODSP_TRANSFER_V07B_E2E_BINDING_V1.json'
      - 'tests/test_v07b_frozen_results.py'
      - 'tests/test_odsp_transfer_v07b_e2e_binding.py'
      - '.github/workflows/odsp-transfer-v07b-e2e.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install eSDM and pinned ODSP
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip install 'git+https://github.com/zuizui0223/odsp.git@0bd83e1ebb372c48839654ab0e42124fe37b8faf'

      - name: Validate frozen v0.7b result and integration binding
        run: >-
          python -m pytest -q
          tests/test_v07b_frozen_results.py
          tests/test_odsp_transfer_v07b_e2e_binding.py

      - name: Download frozen v0.7b result
        uses: actions/download-artifact@v4
        with:
          name: v07b-result-36074930922
          path: build/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36074930922

      - name: Verify frozen v0.7b result hash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          binding = json.loads(Path("ODSP_TRANSFER_V07B_E2E_BINDING_V1.json").read_text())
          path = Path("build/source/v07b_result.json")
          observed = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = binding["source"]["result_sha256"]
          if observed != expected:
              raise SystemExit(f"v0.7b result sha256 mismatch: {observed} != {expected}")
          PY

      - name: Export dynamic occupancy scores to ODSP contract
        run: |
          python scripts/export_v07b_odsp_transfer.py             --result build/source/v07b_result.json             --out-dir build/e2e/odsp

      - name: Run pinned ODSP transfer audit
        run: |
          odsp transfer             --contract build/e2e/odsp/endpoint.json             --out build/e2e/odsp/receipt.json

      - name: Validate ODSP population result and build N3 transfer-value handoff
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          from odsp import (
              build_population_transfer_value_handoff,
              validate_population_transfer_value_handoff,
          )

          binding = json.loads(Path("ODSP_TRANSFER_V07B_E2E_BINDING_V1.json").read_text())
          source = json.loads(Path("build/source/v07b_result.json").read_text())
          receipt = json.loads(Path("build/e2e/odsp/receipt.json").read_text())

          expected = binding["expected_odsp_behavior"]
          point = receipt["point_result"]["predictive_result"]
          certified = receipt["certified_result"]["certification"]
          population = receipt["population_result"]
          total = population["total_gain"]

          assert point["all_group_point_transfer_ceiling"] == expected["point_transfer_ceiling"]
          assert population["group_count"] == expected["population_group_count"]
          assert total["positive_group_count"] == expected["population_positive_group_count"]
          assert math.isclose(
              total["positive_group_fraction"],
              expected["population_positive_group_fraction"],
              rel_tol=0.0,
              abs_tol=1e-15,
          )
          assert math.isclose(
              total["mean_gain"],
              source["summary"]["mean_gain"],
              rel_tol=0.0,
              abs_tol=1e-12,
          )
          assert math.isclose(
              total["mean_gain"],
              expected["population_mean_gain"],
              rel_tol=0.0,
              abs_tol=1e-12,
          )
          assert math.isclose(
              total["mean_gain_lower"],
              expected["population_mean_interval"][0],
              rel_tol=0.0,
              abs_tol=1e-12,
          )
          assert math.isclose(
              total["mean_gain_upper"],
              expected["population_mean_interval"][1],
              rel_tol=0.0,
              abs_tol=1e-12,
          )
          assert total["mean_gain_status"] == expected["population_status"]
          assert (
              population["population_mean_supported_ceiling"]
              == expected["population_transfer_ceiling"]
          )
          assert certified["all_steps_estimable"] is expected["certification_all_steps_estimable"]
          assert certified["estimable_cell_count"] == expected["certification_estimable_cell_count"]
          assert certified["cell_count"] == expected["certification_cell_count"]
          assert certified["certified_transfer_ceiling"] == expected["certified_transfer_ceiling"]

          prediction = [
              total["prediction_lower"],
              total["prediction_upper"],
          ]
          for observed, frozen in zip(prediction, expected["prediction_interval"]):
              assert math.isclose(observed, frozen, rel_tol=0.0, abs_tol=1e-12)

          handoff_spec = binding["n3_handoff"]
          handoff = build_population_transfer_value_handoff(
              evidence_id="esdm-v07b-dynamic-occupancy-transfer-v1",
              population_result=population,
              group_semantics=handoff_spec["group_semantics"],
              population_cluster_semantics=handoff_spec["population_cluster_semantics"],
              score_kind=handoff_spec["score_kind"],
              score_name=handoff_spec["score_name"],
              score_unit=handoff_spec["score_unit"],
              source_receipt="receipt.json",
              source_contract="endpoint.json",
          ).as_dict()

          assert handoff["total_value"]["mean_status"] == handoff_spec["expected_total_status"]
          assert math.isclose(
              handoff["total_value"]["conservative_mean_value"],
              handoff_spec["expected_conservative_mean_value"],
              rel_tol=0.0,
              abs_tol=1e-12,
          )
          assert handoff["boundary"]["authorizes_spatial_patch_ranking"] is False
          assert handoff["boundary"]["authorizes_survey_site_selection"] is False
          assert handoff["boundary"]["n4_survey_action_owner"] == "ACSP"
          validate_population_transfer_value_handoff(handoff)

          output = Path("build/e2e/N2_TO_N3_TRANSFER_VALUE_PAYLOAD_V07B.json")
          output.write_text(
              json.dumps(handoff, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  {
                      "source_mean_gain": source["summary"]["mean_gain"],
                      "odsp_population_mean_gain": total["mean_gain"],
                      "population_interval": [total["mean_gain_lower"], total["mean_gain_upper"]],
                      "population_status": total["mean_gain_status"],
                      "population_ceiling": population["population_mean_supported_ceiling"],
                      "certified_ceiling": certified["certified_transfer_ceiling"],
                      "conservative_transfer_value": handoff["total_value"]["conservative_mean_value"],
                      "handoff_fingerprint": handoff["fingerprint"],
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Upload v0.7b cross-repository integration artifact
        uses: actions/upload-artifact@v4
        with:
          name: esdm-v07b-odsp-transfer-e2e-v1
          path: |
            build/e2e/odsp/scores.csv
            build/e2e/odsp/endpoint.json
            build/e2e/odsp/adapter_manifest.json
            build/e2e/odsp/receipt.json
            build/e2e/N2_TO_N3_TRANSFER_VALUE_PAYLOAD_V07B.json
          if-no-files-found: error
          retention-days: 90
