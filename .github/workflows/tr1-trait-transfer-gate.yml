name: TR1 trait-transfer gate

on:
  pull_request:
    paths:
      - 'TR1_TRAIT_TRANSFER_CONTRACT_V1.json'
      - 'docs/validation/TR1_TRAIT_TRANSFER_GATE_V1.md'
      - 'src/esdm/validate/tr1_trait_transfer.py'
      - 'src/esdm/validate/tr1_gate.py'
      - 'src/esdm/transfer/odsp_adapter.py'
      - 'src/esdm/transfer/__init__.py'
      - 'scripts/run_tr1_replicate.py'
      - 'scripts/aggregate_tr1.py'
      - 'scripts/export_tr1_odsp_transfer.py'
      - 'tests/test_tr1_*.py'
      - '.github/workflows/tr1-trait-transfer-gate.yml'
      - '.github/workflows/tr1-trait-transfer-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen TR1 design without running frozen outcomes
        run: >-
          python -m pytest -q
          tests/test_tr1_contract.py
          tests/test_tr1_trait_transfer_engine.py
          tests/test_tr1_gate.py
          tests/test_tr1_odsp_adapter.py
          tests/test_tr1_scripts.py
          tests/test_tr1_workflow.py
      - name: Compile TR1 runners
        run: >-
          python -m py_compile
          scripts/run_tr1_replicate.py
          scripts/aggregate_tr1.py
          scripts/export_tr1_odsp_transfer.py
