name: E7 Serengeti independent wet-dry diel community one-shot

on:
  pull_request:
    paths:
      - '.github/workflows/e7-serengeti-empirical-once.yml'
      - 'scripts/e7_serengeti_wet_dry_diel.py'
      - 'tests/test_e7_serengeti_wet_dry_diel.py'

permissions:
  contents: read

jobs:
  independent-exploratory-empirical:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install streaming COCO metadata parser and synthetic test tooling
        run: |
          python -m pip install 'ijson>=3.2,<4' 'pytest>=8'
          python -m compileall -q scripts/e7_serengeti_wet_dry_diel.py
          python -m pytest -q tests/test_e7_serengeti_wet_dry_diel.py
      - name: Download only the eleven independently public LILA JSON metadata ZIPs
        run: |
          set -euo pipefail
          mkdir -p source/e7
          BASE=https://lilawildlife.blob.core.windows.net/lila-wildlife/snapshotserengeti-v-2-0
          for SEASON in $(seq -w 1 11); do
            TARGET="source/e7/SnapshotSerengetiS${SEASON}.json.zip"
            curl --fail --location --retry 3 --retry-delay 2 \
              --connect-timeout 30 --max-time 600 --silent --show-error \
              --output "${TARGET}" "${BASE}/SnapshotSerengetiS${SEASON}.json.zip"
            python -c "import sys,zipfile; p=sys.argv[1]; assert zipfile.is_zipfile(p), p" "${TARGET}"
            sha256sum "${TARGET}"
          done
      - name: Open E7 discovery labels once then validation labels after roster freeze
        run: |
          mkdir -p build/e7
          python scripts/e7_serengeti_wet_dry_diel.py \
            --input-dir source/e7 \
            --output build/e7/E7_SERENGETI_WET_DRY_COMMUNITY_RESULT.json
      - name: Retain only aggregate taxon and camera-support results and exact archive hashes
        uses: actions/upload-artifact@v4
        with:
          name: e7-serengeti-wet-dry-${{ github.run_id }}
          path: build/e7/E7_SERENGETI_WET_DRY_COMMUNITY_RESULT.json
          if-no-files-found: error
          retention-days: 90
