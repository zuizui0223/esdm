name: NeoBat original GBIF bat DOI target-group denominator once

on:
  push:
    branches:
      - analysis/neobat-bat-targetgroup-background-20261119
    paths:
      - docs/replication/neobat/NEOBAT_BAT_TARGETGROUP_ONCE_20261119.txt

permissions:
  contents: write
concurrency:
  group: neobat-bat-targetgroup-20261119
  cancel-in-progress: false

jobs:
  original_bat_source_targetgroup:
    if: github.event.head_commit.message == 'dispatch frozen NeoBat bat-only target-group original DOI once' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/neobat-bat-targetgroup-background-20261119
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-only projection dependency
        run: python -m pip install 'pyproj==3.7.2'
      - name: Verify prior frozen design, original ZIP provenance and synthetic code
        run: |
          test -f docs/replication/NEOBAT_BAT_TARGETGROUP_BACKGROUND_SOURCE_GATE_FROZEN_20261119.md
          test -f docs/replication/neobat/NEOBAT_STRICT_84_COUNTRY_FOLD_ROSTER_FROZEN_20261119.json
          python -m py_compile scripts/neobat_bat_targetgroup_background_gate.py
          python -m unittest discover -s tests -p 'test_neobat_bat_targetgroup_background_gate.py' -v
      - name: Stream original 85,912-record GBIF bat DOI with exact SHA and full-QC replay
        run: |
          set +e
          python -m scripts.neobat_bat_targetgroup_background_gate \
            --out build/neobat/bat_targetgroup_background_gate.json
          status=$?
          set -e
          echo "$status" > build/neobat/bat_targetgroup_background_gate_exit_code.txt
          echo "NEOBAT_BAT_TARGETGROUP_SOURCE_EXIT=$status"
      - name: Archive aggregate species-country counts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neobat-bat-background-84fold-aggregate
          path: |
            build/neobat/bat_targetgroup_background_gate.json
            build/neobat/bat_targetgroup_background_gate_exit_code.txt
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve only aggregate source receipt or precise STOP
        if: always()
        run: |
          set -euo pipefail
          test -f build/neobat/bat_targetgroup_background_gate.json
          cp build/neobat/bat_targetgroup_background_gate.json docs/replication/neobat/
          cp build/neobat/bat_targetgroup_background_gate_exit_code.txt docs/replication/neobat/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/replication/neobat/bat_targetgroup_background_gate*
          if ! git diff --cached --quiet; then
            git commit -m "evidence: source-verified bat target-group background feasibility for all 84 frozen folds"
            git pull --rebase origin analysis/neobat-bat-targetgroup-background-20261119
            git push origin HEAD:analysis/neobat-bat-targetgroup-background-20261119
          fi
      - name: Fail closed on original-source or roster discrepancy
        run: |
          test "$(cat build/neobat/bat_targetgroup_background_gate_exit_code.txt)" = "0"
