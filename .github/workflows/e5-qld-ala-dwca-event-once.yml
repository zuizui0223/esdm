name: E5 Queensland ALA DwC-A Event-core precheck once

concurrency:
  group: e5-qld-ala-dwca-event-once
  cancel-in-progress: false

on:
  push:
    branches:
      - e5/qld-ala-dwca-event-v1
    paths:
      - 'docs/replication/E5_QLD_ALA_DWCA_EVENT_AUTHORIZED.json'

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify pure one-shot Event-core authorization
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          marker_path = Path(
              "docs/replication/E5_QLD_ALA_DWCA_EVENT_AUTHORIZED.json"
          )
          marker = json.loads(marker_path.read_text(encoding="utf-8"))
          parent = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"], text=True
          ).strip()
          changed = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
              text=True,
          ).splitlines()
          contract_path = Path(
              "docs/replication/E5_QLD_ALA_DWCA_EVENT_CONTRACT.json"
          )
          contract_blob = subprocess.check_output(
              ["git", "hash-object", str(contract_path)], text=True
          ).strip()

          if changed != [marker_path.as_posix()]:
              raise SystemExit("authorization commit must change only marker")
          if marker.get("implementation_parent_sha") != parent:
              raise SystemExit("implementation parent mismatch")
          if marker.get("programme_id") != "E5_INDEPENDENT_ACTIVITY_DETECTION":
              raise SystemExit("programme mismatch")
          if marker.get("candidate_id") != "qld_wet_tropics_camtrapdp_2022_2023":
              raise SystemExit("candidate mismatch")
          if marker.get("contract_id") != (
              "e5-qld-ala-dwca-event-core-response-blind-v1"
          ):
              raise SystemExit("contract id mismatch")
          if marker.get("contract_blob_sha") != "f654e244f73bf7970d9af5f1f416d9259d21aac1":
              raise SystemExit("contract blob pin mismatch")
          if contract_blob != marker["contract_blob_sha"]:
              raise SystemExit("working-tree contract blob mismatch")
          if marker.get("precheck_authorized") is not True:
              raise SystemExit("precheck not authorized")
          if marker.get("one_shot") is not True:
              raise SystemExit("authorization must be one-shot")
          if marker.get("occurrence_extension_opening_authorized") is not False:
              raise SystemExit("Occurrence extension remains forbidden")
          if marker.get("focal_response_opening_authorized") is not False:
              raise SystemExit("focal response remains forbidden")
          PY

      - name: Compile Event-core precheck
        run: python -m py_compile scripts/precheck_e5_qld_ala_dwca_event.py

      - name: Download public ALA DwC-A archive
        run: |
          mkdir -p build/private build/public
          curl --location --fail --retry 3 --retry-delay 2 \
            'https://dwca-exports.ala.org.au/dr31594.zip' \
            --output build/private/dr31594.zip
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p = Path("build/private/dr31594.zip")
          if not zipfile.is_zipfile(p):
              raise SystemExit("downloaded ALA archive is not ZIP")
          PY

      - name: Run Event-core-only precheck
        run: |
          python scripts/precheck_e5_qld_ala_dwca_event.py \
            --archive build/private/dr31594.zip \
            --contract docs/replication/E5_QLD_ALA_DWCA_EVENT_CONTRACT.json \
            --out build/public/E5_QLD_ALA_DWCA_EVENT_RESULT.json

      - name: Verify response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(
              Path("build/public/E5_QLD_ALA_DWCA_EVENT_RESULT.json")
              .read_text(encoding="utf-8")
          )
          b = value["response_boundary"]
          assert b["occurrence_extension_data_opened"] is False
          assert b["occurrence_rows_read"] == 0
          assert b["media_files_opened"] == 0
          assert b["species_or_taxon_values_read"] == 0
          assert b["focal_response_opened"] is False
          assert value["decision"]["candidate_qualified"] is False
          assert value["decision"]["occurrence_extension_opening_authorized"] is False
          PY

      - name: Destroy response-bearing archive before upload
        run: |
          rm -f build/private/dr31594.zip
          test ! -e build/private/dr31594.zip

      - name: Upload Event-core summary only
        uses: actions/upload-artifact@v4
        with:
          name: e5-qld-ala-dwca-event-${{ github.run_id }}
          path: build/public/E5_QLD_ALA_DWCA_EVENT_RESULT.json
          if-no-files-found: error
          retention-days: 90
