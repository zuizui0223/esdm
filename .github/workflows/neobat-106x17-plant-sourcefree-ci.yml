name: NeoBat botanical 106x17 source-effort transfer synthetic correctness
on:
  push:
    branches:
      - analysis/neobat-106plant-17country-effort-transfer-20261119
    paths:
      - scripts/neobat_106plant_17country_source_effort_transfer.py
      - tests/test_neobat_106plant_17country_source_effort_transfer.py
      - .github/workflows/neobat-106x17-plant-sourcefree-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sourcefree:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical regression dependencies
        run: python -m pip install 'numpy==2.2.6' 'scikit-learn==1.7.2'
      - name: Verify 1802 full universe, known truth and country equal inference
        run: |
          python -m py_compile scripts/neobat_106plant_17country_source_effort_transfer.py
          python -m unittest discover -s tests -p 'test_neobat_106plant_17country_source_effort_transfer.py' -v
