name: Safari14 independent cross-reserve relative diel audit

on:
  pull_request:
    paths:
      - '.github/workflows/safari14-crosspark-diel.yml'
      - 'scripts/safari14_crosspark_diel.py'
      - 'tests/test_safari14_crosspark_diel.py'

permissions:
  contents: read

jobs:
  independent-14-reserve-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test frozen design and source grammar on synthetic metadata only
        run: |
          python -m pip install 'ijson>=3.2,<4' 'pytest>=8'
          python -m py_compile scripts/safari14_crosspark_diel.py
          python -m pytest -q tests/test_safari14_crosspark_diel.py
      - name: Retrieve only official LILA Safari 2024 COCO metadata ZIP, never images
        run: |
          set -euo pipefail
          mkdir -p source/safari14
          curl --fail --location --retry 3 --retry-delay 3 \
            --connect-timeout 30 --max-time 900 --silent --show-error \
            --output source/safari14/snapshot_safari_2024_metadata.zip \
            https://storage.googleapis.com/public-datasets-lila/snapshot-safari-2024-expansion/snapshot_safari_2024_metadata.zip
          echo '2327ffec714f6460eff7307efc32c32c61c6805dbcab8334d4d6485eeb079ac1  source/safari14/snapshot_safari_2024_metadata.zip' | sha256sum --check
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          p=Path("source/safari14/snapshot_safari_2024_metadata.zip")
          assert zipfile.is_zipfile(p), "official file is not a ZIP"
          with zipfile.ZipFile(p) as z:
              names=[n for n in z.namelist() if n.endswith(".json") and not n.endswith("/")]
          assert len(names)==1, f"expected one source COCO JSON, got {len(names)}"
          print("original_source_zip_sha256",hashlib.sha256(p.read_bytes()).hexdigest(),flush=True)
          print("original_source_zip_bytes",p.stat().st_size,flush=True)
          PY
      - name: Open novel S14 non-Serengeti discovery then heldout reserves
        run: |
          mkdir -p build/safari14
          python -m scripts.safari14_crosspark_diel \
            --zip source/safari14/snapshot_safari_2024_metadata.zip \
            --out build/safari14/SAFARI14_CROSSPARK_DIEL_RESULT.json
      - name: Preserve ONLY aggregate source/park/taxon/pair receipt
        uses: actions/upload-artifact@v4
        with:
          name: safari14-crosspark-diel-${{ github.run_id }}
          path: build/safari14/SAFARI14_CROSSPARK_DIEL_RESULT.json
          if-no-files-found: error
          retention-days: 90
