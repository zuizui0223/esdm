name: v0.3.1 frozen Gate E SBC full run

on:
  push:
    branches:
      - feature/v031-identification-fixes
    paths:
      - .github/workflows/v031-sbc-full-once.yml

jobs:
  gate-e:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[inference]"
      - name: Run frozen Gate E all-parameter SBC
        run: python scripts/run_v031_sbc.py --output artifacts/v031_sbc.json
      - name: Upload Gate E audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v031-gate-e-${{ github.run_id }}
          path: artifacts/v031_sbc.json
          if-no-files-found: error
