name: v0.7g deterministic calibration frontier

on:
  push:
    branches:
      - feature/v07g-calibration-placement
    paths:
      - .github/workflows/v07g-calibration-frontier.yml
      - scripts/run_v07g_frontier.py
      - src/esdm/validate/v07g_fixture.py
      - src/esdm/validate/v07g_frontier.py
      - tests/test_v07g_fixture.py

jobs:
  frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,inference]"
      - name: Test v0.7g deterministic contracts
        run: |
          python -m pytest -q tests/test_v07g_fixture.py
      - name: Evaluate calibration frontier
        run: |
          mkdir -p artifacts
          python scripts/run_v07g_frontier.py             --output artifacts/v07g_frontier.json
      - name: Upload deterministic frontier
        uses: actions/upload-artifact@v4
        with:
          name: v07g-frontier-${{ github.run_id }}
          path: artifacts/v07g_frontier.json
          if-no-files-found: error
