name: NeoBat posthoc effort-conditional source-free regression
on:
  push:
    branches:
      - analysis/neobat-plant-effort-confounding-20261119
    paths:
      - scripts/neobat_plant_effort_confounding_diagnostic.py
      - tests/test_neobat_plant_effort_confounding_diagnostic.py
      - .github/workflows/neobat-plant-effort-sourcefree-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sourcefree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned synthetic model dependencies
        run: python -m pip install 'numpy==2.2.6' 'scikit-learn==1.7.2'
      - name: Compile and test original replay, conditional rank null
        run: |
          python -m py_compile scripts/neobat_plant_effort_confounding_diagnostic.py
          python -m unittest discover -s tests -p 'test_neobat_plant_effort_confounding_diagnostic.py' -v
