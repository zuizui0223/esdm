name: E5 Henrich10 OSF response-blind manifest once

concurrency:
  group: e5-henrich10-osf-manifest-once
  cancel-in-progress: false

on:
  push:
    branches:
      - e5/henrich10-osf-manifest-v1
    paths:
      - 'docs/replication/E5_HENRICH10_OSF_MANIFEST_AUTHORIZED.json'

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify pure one-shot authorization
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          marker_path = Path(
              "docs/replication/E5_HENRICH10_OSF_MANIFEST_AUTHORIZED.json"
          )
          contract_path = Path(
              "docs/replication/E5_HENRICH10_OSF_MANIFEST_CONTRACT.json"
          )
          marker = json.loads(marker_path.read_text(encoding="utf-8"))
          contract = json.loads(contract_path.read_text(encoding="utf-8"))
          parent = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"], text=True
          ).strip()
          changed = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
              text=True,
          ).splitlines()
          contract_blob = subprocess.check_output(
              ["git", "hash-object", str(contract_path)], text=True
          ).strip()

          if changed != [marker_path.as_posix()]:
              raise SystemExit("authorization commit must change only marker")
          if marker.get("implementation_parent_sha") != parent:
              raise SystemExit("implementation parent mismatch")
          if marker.get("programme_id") != "E5_INDEPENDENT_ACTIVITY_DETECTION":
              raise SystemExit("programme mismatch")
          if marker.get("candidate_id") != "henrich10_ctds_germany_2019_2020":
              raise SystemExit("candidate mismatch")
          if marker.get("contract_id") != "e5-henrich10-osf-manifest-response-blind-v1":
              raise SystemExit("contract id mismatch")
          if marker.get("contract_blob_sha") != "df711171ba19703c20a760c66e97f75a096861a5":
              raise SystemExit("contract blob pin mismatch")
          if contract_blob != marker["contract_blob_sha"]:
              raise SystemExit("working-tree contract mismatch")
          if contract.get("status") != "FROZEN_MANIFEST_NOT_AUTHORIZED":
              raise SystemExit("contract status drift")
          if marker.get("manifest_authorized") is not True:
              raise SystemExit("manifest not authorized")
          if marker.get("one_shot") is not True:
              raise SystemExit("authorization must be one-shot")
          if marker.get("file_content_read_authorized") is not False:
              raise SystemExit("file contents remain forbidden")
          if marker.get("focal_response_opening_authorized") is not False:
              raise SystemExit("focal response remains forbidden")
          PY

      - name: Run OSF metadata-only manifest precheck
        run: |
          mkdir -p build/public
          python scripts/precheck_e5_henrich10_osf_manifest.py \
            --contract docs/replication/E5_HENRICH10_OSF_MANIFEST_CONTRACT.json \
            --out build/public/E5_HENRICH10_OSF_MANIFEST_RESULT.json

      - name: Verify response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(
              Path("build/public/E5_HENRICH10_OSF_MANIFEST_RESULT.json")
              .read_text(encoding="utf-8")
          )
          b = value["response_boundary"]
          assert b["file_downloads_followed"] == 0
          assert b["file_previews_opened"] == 0
          assert b["file_contents_opened"] == 0
          assert b["biological_rows_read"] == 0
          assert b["focal_response_opened"] is False
          assert all(
              url.startswith("https://api.osf.io/v2/nodes/3vwkq/")
              for url in b["requested_urls"]
          )
          d = value["decision"]
          assert d["candidate_qualified"] is False
          assert d["G2_pass_authorized"] is False
          assert d["final_G4_pass_authorized"] is False
          assert d["focal_response_opening_authorized"] is False
          PY

      - name: Upload manifest result only
        uses: actions/upload-artifact@v4
        with:
          name: e5-henrich10-osf-manifest-${{ github.run_id }}
          path: build/public/E5_HENRICH10_OSF_MANIFEST_RESULT.json
          if-no-files-found: error
          retention-days: 90
