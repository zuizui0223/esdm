name: empirical Snapshot Japan CamtrapDP response capture

concurrency:
  group: empirical-snapshot-japan-camtrapdp-response-capture
  cancel-in-progress: false

on:
  push:
    branches:
      - empirical/snapshot-japan-camtrapdp-final
    paths:
      - docs/empirical/SNAPSHOT_JAPAN_CAMTRAPDP_FINAL_CONTRACT.json
      - docs/empirical/SNAPSHOT_JAPAN_CAMTRAPDP_RESPONSE_AUTHORIZED
      - docs/empirical/SNAPSHOT_JAPAN_CAMTRAPDP_CLIMATE_FROZEN.json
      - scripts/capture_snapshot_japan_camtrapdp_response.py
      - src/esdm/validate/empirical_snapshot_japan_camtrapdp.py
      - tests/test_empirical_snapshot_japan_final_contract.py
      - .github/workflows/empirical-snapshot-japan-camtrapdp-response-once.yml

permissions:
  actions: read
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify final contract before response opening
        run: |
          python -m pytest -q             tests/test_empirical_snapshot_japan_camtrapdp.py             tests/test_empirical_snapshot_japan_fit.py             tests/test_empirical_snapshot_japan_final_contract.py
      - name: Check one-shot response authorization
        id: auth
        run: |
          marker=docs/empirical/SNAPSHOT_JAPAN_CAMTRAPDP_RESPONSE_AUTHORIZED
          if [ ! -f "$marker" ]; then
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --diff-filter=A --name-only HEAD^ HEAD | grep -Fxq "$marker"; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "response authorization was not newly added" >&2
            exit 1
          fi
      - name: Download frozen response-blind climate artifact
        if: steps.auth.outputs.authorized == 'true'
        uses: actions/download-artifact@v4
        with:
          name: empirical-snapshot-japan-camtrapdp-climate-36271741095
          path: frozen-climate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36271741095
      - name: Capture and qualify Camtrap DP response once
        if: steps.auth.outputs.authorized == 'true'
        run: |
          mkdir -p artifacts/source
          python scripts/capture_snapshot_japan_camtrapdp_response.py             --climate frozen-climate/snapshot_japan_camtrapdp_climate.json             --source-output artifacts/source/oo_1246258.zip             --output artifacts/capture_result.json
      - name: Upload immutable empirical capture
        if: always() && steps.auth.outputs.authorized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: empirical-snapshot-japan-camtrapdp-capture-${{ github.run_id }}
          path: |
            artifacts/capture_result.json
            artifacts/source/oo_1246258.zip
          if-no-files-found: error
          retention-days: 90
