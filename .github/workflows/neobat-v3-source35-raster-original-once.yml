name: NeoBat original fixed35 dataset-disjoint 25km raster trainability once

on:
  push:
    branches:
      - analysis/neobat-v3-source35-raster-trainability-20261119
    paths:
      - docs/replication/neobat/NEOBAT_V3_SOURCE35_RASTER_ONCE_20261119.txt

permissions:
  contents: write

concurrency:
  group: neobat-source35-raster-original-20261119
  cancel-in-progress: false

jobs:
  source35_original_raster_trainability:
    if: github.event.head_commit.message == 'dispatch frozen NeoBat v3 original 35 plant source-disjoint raster once' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/neobat-v3-source35-raster-trainability-20261119
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original source-only raster and equal-area projection dependencies
        run: python -m pip install 'numpy==2.2.6' 'rasterio==1.4.3' 'pyproj==3.7.2'
      - name: Verify separate source pre-result freeze, full 595 support, and synthetic tests
        run: |
          test -f docs/replication/NEOBAT_V3_SOURCE35_DATASET_DISJOINT_RASTER_TRAINABILITY_FROZEN_20261119.md
          test -f docs/replication/neobat/v3_source_disjoint35_partner_gate.json
          test -f docs/replication/neobat/plant_106x17_global_source_embargo.json
          python -m py_compile scripts/neobat_v3_source35_raster_gate.py
          python -m unittest discover -s tests -p 'test_neobat_v3_source35_raster_gate.py' -v
      - name: Stream authenticated original GBIF/WorldClim and count all source-disjoint 35x17 post-raster cohorts
        run: |
          mkdir -p build/neobat
          set +e
          python -m scripts.neobat_v3_source35_raster_gate \
            --out build/neobat/v3_source35_raster_trainability.json \
            --compact build/neobat/v3_source35_raster_trainability_compact.json
          status=$?
          set -e
          echo "$status" > build/neobat/v3_source35_raster_trainability_exit_code.txt
          echo "NEOBAT_SOURCE35_ORIGINAL_RASTER_EXIT=$status"
      - name: Archive original-source aggregate only or explicit source stop
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neobat-v3-original35-dataset-disjoint-raster-input-aggregates
          path: |
            build/neobat/v3_source35_raster_trainability.json
            build/neobat/v3_source35_raster_trainability_compact.json
            build/neobat/v3_source35_raster_trainability_exit_code.txt
          retention-days: 90
          if-no-files-found: warn
      - name: Commit only 595/84 aggregate source input counters to the research branch
        if: always()
        run: |
          set -euo pipefail
          test -f build/neobat/v3_source35_raster_trainability.json
          cp build/neobat/v3_source35_raster_trainability* docs/replication/neobat/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/replication/neobat/v3_source35_raster_trainability*
          if ! git diff --cached --quiet; then
            git commit -m "evidence: original 35x17 source-disjoint plant raster cell denominators and 84 bat source gates"
            git pull --rebase origin analysis/neobat-v3-source35-raster-trainability-20261119
            git push origin HEAD:analysis/neobat-v3-source35-raster-trainability-20261119
          fi
      - name: Reject source checksum drift and missing 595 or 84 source counts
        run: |
          test "$(cat build/neobat/v3_source35_raster_trainability_exit_code.txt)" = "0"
