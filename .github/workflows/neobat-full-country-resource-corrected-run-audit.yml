name: NeoBat inspect corrected full DOI country resource gate execution (read-only)

on:
  push:
    branches:
      - design/neobat-trophic-sdm-phase1-20261119
    paths:
      - .github/workflows/neobat-full-country-resource-corrected-run-audit.yml

permissions:
  contents: write
  actions: read

jobs:
  inspect_pinned_full_source_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check read-only metadata inspector
        run: |
          python -m py_compile scripts/neobat_audit_gbif_submission_run.py
          python -m unittest discover -s tests -p 'test_neobat_audit_gbif_submission_run.py' -v
      - name: Inspect exact push trigger, without any new GBIF data request
        run: |
          set +e
          python -m scripts.neobat_audit_gbif_submission_run \
            --marker-sha 8891ce251ad07b67189461495bedcb38927c364b \
            --workflow-file neobat-full-country-resource-corrected-once.yml \
            --workflow-name "NeoBat corrected strict DOI source-country resource input gate" \
            --out docs/replication/neobat/doi_country_resource_corrected_action_audit.json
          rc=$?
          set -e
          echo "$rc" > docs/replication/neobat/doi_country_resource_corrected_action_audit_exit_code.txt
      - name: Preserve audit-only status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neobat-country-source-corrected-gate-action-audit
          path: |
            docs/replication/neobat/doi_country_resource_corrected_action_audit.json
            docs/replication/neobat/doi_country_resource_corrected_action_audit_exit_code.txt
          if-no-files-found: warn
          retention-days: 90
      - name: Commit safe metadata to research branch
        if: always()
        run: |
          set -euo pipefail
          test -f docs/replication/neobat/doi_country_resource_corrected_action_audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/replication/neobat/doi_country_resource_corrected_action_audit.json docs/replication/neobat/doi_country_resource_corrected_action_audit_exit_code.txt
          if ! git diff --cached --quiet; then
            git commit -m "evidence: preserve exact source country resource gate workflow status"
            git pull --rebase origin design/neobat-trophic-sdm-phase1-20261119
            git push origin HEAD:design/neobat-trophic-sdm-phase1-20261119
          fi
