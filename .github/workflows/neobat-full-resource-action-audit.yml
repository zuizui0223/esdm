name: NeoBat diagnose first full-DOI resource-country gate (read-only)
on:
  push:
    branches:
      - design/neobat-trophic-sdm-phase1-20261119
    paths:
      - .github/workflows/neobat-full-resource-action-audit.yml
permissions:
  actions: read
  contents: write
jobs:
  read_original_precision_resource_gate_status:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm audit can only GET GitHub metadata
        run: |
          python -m py_compile scripts/neobat_audit_gbif_submission_run.py
          python -m unittest discover -s tests -p 'test_neobat_audit_gbif_submission_run.py' -v
      - name: Read exact gate run and job step status, never rerun GBIF analysis
        run: |
          mkdir -p docs/replication/neobat
          set +e
          python -m scripts.neobat_audit_gbif_submission_run \
            --marker-sha f7077c9cf4fcb819fbb3c41312834c284b3a191a \
            --workflow-file neobat-full-doi-resource-country-gate.yml \
            --workflow-name "NeoBat full DOI precision-conditioned country resource input feasibility" \
            --out docs/replication/neobat/gbif_precision_resource_action_audit.json
          rc=$?
          set -e
          echo "$rc" > docs/replication/neobat/gbif_precision_resource_action_audit_exit_code.txt
      - name: Save outcome or explicit source-audit stop
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neobat-precision-resource-action-audit
          path: docs/replication/neobat/gbif_precision_resource_action_audit*
          if-no-files-found: warn
          retention-days: 90
      - name: Record safe aggregate run and steps in draft branch
        if: always()
        run: |
          set -euo pipefail
          test -f docs/replication/neobat/gbif_precision_resource_action_audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/replication/neobat/gbif_precision_resource_action_audit*
          if ! git diff --cached --quiet; then
            git commit -m "evidence: diagnose full DOI precision resource gate without rerunning"
            git pull --rebase origin design/neobat-trophic-sdm-phase1-20261119
            git push origin HEAD:design/neobat-trophic-sdm-phase1-20261119
          fi
