name: NeoBat CC1 original seed-rain portfolio one-shot
on:
  push:
    branches: [analysis/neobat-cc1-seed-portfolio-20261124]
    paths:
      - '.github/workflows/neobat-cc1-original-seed-portfolio.yml'
      - 'scripts/neobat_cc1_seed_portfolio.py'
      - 'tests/test_neobat_cc1_seed_portfolio.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cc1-original:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen model-independent CC1 source parser and shift-null tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_neobat_cc1_seed_portfolio.py
      - name: Execute public original seed-rain by author commit and frozen NeoBat links
        timeout-minutes: 10
        run: |
          mkdir -p build/neobat
          python -m scripts.neobat_cc1_seed_portfolio \
            --manifest docs/replication/NEOBAT_INDEPENDENT_PLOT_CROSSWALK_INPUT_20261121.json \
            --out build/neobat/cc1_seed_portfolio_20261124.json
      - name: Preserve original-source aggregate result on this research branch
        if: success()
        run: |
          set -euo pipefail
          cp build/neobat/cc1_seed_portfolio_20261124.json \
             docs/replication/neobat/cc1_original_seed_portfolio_result_20261124.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/replication/neobat/cc1_original_seed_portfolio_result_20261124.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: preserve original CC1 seed time-series candidate portfolio result'
            git push origin HEAD:analysis/neobat-cc1-seed-portfolio-20261124
          fi
      - name: Archive aggregate results only; no raw trap records or coordinates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neobat-cc1-original-seed-portfolio
          path: build/neobat/cc1_seed_portfolio_20261124.json
          retention-days: 45
          if-no-files-found: warn
