name: v0.7l selective adaptation audit

on:
  pull_request:
    paths:
      - 'src/esdm/validate/v07l_audit.py'
      - 'scripts/run_v07l_audit.py'
      - 'tests/test_v07l_audit.py'
      - '.github/workflows/v07l-selective-adaptation-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic audit dependencies
        run: python -m pip install -e '.[dev,inference]'
      - name: Validate frozen fresh-grid selection rules
        run: python -m pytest -q tests/test_v07l_audit.py
      - name: Run deterministic fresh-world audit
        run: |
          mkdir -p build
          python scripts/run_v07l_audit.py             --output build/V07L_AUDIT_RESULTS.json
      - uses: actions/upload-artifact@v4
        with:
          name: v07l-selective-adaptation-audit
          path: build/V07L_AUDIT_RESULTS.json
          if-no-files-found: error
          retention-days: 90
