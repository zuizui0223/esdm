name: E3 MICA post-result ODSP audit

on:
  pull_request:
    paths:
      - 'docs/replication/E3_MICA_ODSP_POSTRESULT_AUDIT_CONTRACT.json'
      - 'scripts/export_e3_mica_odsp_parallel.py'
      - 'scripts/summarize_e3_mica_odsp_audit.py'
      - 'tests/test_e3_mica_odsp_postresult_audit.py'
      - '.github/workflows/e3-mica-odsp-postresult-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/replication/E3_MICA_REDUCED_FROZEN_RESULT.json'

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install eSDM
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen post-result audit boundary
        run: >-
          python -m pytest -q
          tests/test_e3_mica_odsp_serialization.py
          tests/test_e3_mica_odsp_serialization_contract.py
          tests/test_e3_mica_odsp_postresult_audit.py
      - name: Compile audit runners
        run: >-
          python -m py_compile
          scripts/export_e3_mica_odsp_parallel.py
          scripts/summarize_e3_mica_odsp_audit.py

  route:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      receipt_added: ${{ steps.route.outputs.receipt_added }}
      audit_authorized: ${{ steps.route.outputs.audit_authorized }}
      workflow_run_id: ${{ steps.route.outputs.workflow_run_id }}
      artifact_name: ${{ steps.route.outputs.artifact_name }}
      result_sha256: ${{ steps.route.outputs.result_sha256 }}
      source_status: ${{ steps.route.outputs.source_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Route frozen E3 result
        id: route
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          canonical = Path("docs/replication/E3_MICA_REDUCED_FROZEN_RESULT.json")
          added = subprocess.check_output(
              ["git", "diff", "--diff-filter=A", "--name-only", "HEAD^", "HEAD"],
              text=True,
          ).splitlines()
          receipt_added = canonical.as_posix() in added
          if not canonical.is_file():
              raise SystemExit("canonical E3 frozen result receipt is missing")
          receipt = json.loads(canonical.read_text(encoding="utf-8"))
          status = str(receipt.get("status"))
          decision = receipt.get("decision", {})
          authorized = (
              receipt_added
              and receipt.get("result_id") == "e3-mica-reduced-frozen-result-v1"
              and receipt.get("programme_id") == "E3_MICA_EXP"
              and status == "E3_EXPLORATORY_RESULT"
              and decision.get("sampling_gate_passed") is True
          )
          execution = receipt.get("execution", {})
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"receipt_added={'true' if receipt_added else 'false'}\n")
              handle.write(f"audit_authorized={'true' if authorized else 'false'}\n")
              handle.write(f"workflow_run_id={execution.get('workflow_run_id', '')}\n")
              handle.write(f"artifact_name={execution.get('artifact_name', '')}\n")
              handle.write(f"result_sha256={execution.get('result_json_sha256', '')}\n")
              handle.write(f"source_status={status}\n")
          PY

  audit:
    if: needs.route.outputs.receipt_added == 'true' && needs.route.outputs.audit_authorized == 'true'
    needs: [validate, route]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install eSDM and pinned ODSP
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'git+https://github.com/zuizui0223/odsp.git@0bd83e1ebb372c48839654ab0e42124fe37b8faf'
      - name: Download frozen E3 raw result
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.route.outputs.artifact_name }}
          path: build/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.route.outputs.workflow_run_id }}
      - name: Verify raw result hash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          path = Path("build/source/E3_MICA_REDUCED_EMPIRICAL_RESULT.json")
          observed = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = os.environ["EXPECTED_SHA"]
          if observed != expected:
              raise SystemExit(f"E3 raw result sha256 mismatch: {observed} != {expected}")
          PY
        env:
          EXPECTED_SHA: ${{ needs.route.outputs.result_sha256 }}
      - name: Export parallel E3 ODSP bundles
        run: |
          python scripts/export_e3_mica_odsp_parallel.py             --result build/source/E3_MICA_REDUCED_EMPIRICAL_RESULT.json             --out-dir build/odsp
      - name: Run activity ODSP audit
        run: |
          odsp transfer             --contract build/odsp/activity/endpoint.json             --out build/odsp/activity/receipt.json
      - name: Run state ODSP audit
        run: |
          odsp transfer             --contract build/odsp/state/endpoint.json             --out build/odsp/state/receipt.json
      - name: Summarize parallel within-endpoint audits
        run: |
          python scripts/summarize_e3_mica_odsp_audit.py             --source-receipt docs/replication/E3_MICA_REDUCED_FROZEN_RESULT.json             --activity-receipt build/odsp/activity/receipt.json             --state-receipt build/odsp/state/receipt.json             --out build/E3_MICA_ODSP_AUDIT_RESULT_V1.json
      - name: Upload E3 ODSP audit result
        uses: actions/upload-artifact@v4
        with:
          name: e3-mica-odsp-postresult-audit-v1
          path: |
            build/E3_MICA_ODSP_AUDIT_RESULT_V1.json
            build/odsp/activity/
            build/odsp/state/
          if-no-files-found: error
          retention-days: 90

  blocked:
    if: needs.route.outputs.receipt_added == 'true' && needs.route.outputs.audit_authorized != 'true'
    needs: [validate, route]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record terminal non-audit result
        run: |
          mkdir -p build
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(
              Path("docs/replication/E3_MICA_REDUCED_FROZEN_RESULT.json").read_text()
          )
          payload = {
              "schema_version": 1,
              "audit_id": "e3-mica-odsp-parallel-audit-result-v1",
              "audit_status": "NOT_AUTHORIZED_SOURCE_RESULT",
              "source_status": source.get("status"),
              "sampling_gate_passed": source.get("decision", {}).get("sampling_gate_passed"),
              "odsp_executed": False,
              "boundary": {
                  "n3_transfer_value_handoff_authorized": False,
                  "combined_three_level_filtration_authorized": False,
                  "e2_rescue": False,
              },
          }
          Path("build/E3_MICA_ODSP_AUDIT_RESULT_V1.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e3-mica-odsp-postresult-audit-v1
          path: build/E3_MICA_ODSP_AUDIT_RESULT_V1.json
          if-no-files-found: error
          retention-days: 90
