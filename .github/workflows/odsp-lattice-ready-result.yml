name: odsp-lattice-ready-result

on:
  pull_request:
    paths:
      - 'src/esdm/transfer/odsp_lattice_adapter.py'
      - 'src/esdm/transfer/__init__.py'
      - 'ODSP_LATTICE_READY_RESULT_PROTOCOL_V1.json'
      - 'tests/test_odsp_lattice_ready_result.py'
      - 'docs/integration/ODSP_LATTICE_READY_RESULT_PROTOCOL.md'
      - '.github/workflows/odsp-lattice-ready-result.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install eSDM
        run: python -m pip install -e '.[dev]'
      - name: Validate lattice-ready result protocol
        run: python -m pytest -q tests/test_odsp_lattice_ready_result.py
