[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esdm"
version = "0.1.0.dev0"
description = "Process-based ecological state distribution modelling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ZHANG RUIQI"}]
dependencies = []

[project.optional-dependencies]
inference = ["numpyro>=0.21,<0.22; python_version >= '3.11'"]
dev = [
  "pytest>=8",
  "numpyro>=0.21,<0.22; python_version >= '3.11'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
